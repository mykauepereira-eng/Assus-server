 empty:()=>({prod:[],serv:[],lav:[],cli:[],etp:[],meta:null,log:[],desl:{ida:null,volta:null,vm:false,kmc:1,fixa:0,preco:null,raio:10,lim:40},lim:{baixo:30,crit:10},ult:null,last:null,sel:'',fid:{on:true,ciclo:6,faixas:[{pos:6,pct:80}]},seq:{lav:0,car:0,lead:0,fin:0},usr:[],cargos:[],carros:[],leads:[],fin:[],aud:[],cfg:{empresa:'',saldoIni:0,proj:{otim:15,pess:20,desp:10}}}),

 parse(f){

 },
 addProd(s,f){const r=Core.parse(f);if(!r.ok)return r;const id=Core.id();s.prod.push({id,...r.v,atual:r.v.vol});return{ok:true,id}},

 addServ(s,n,f={}){n=(n||'').trim();if(!n)return err('Informe o nome do serviço.');if(s.serv.some(v=>v.n.toLowerCase()===n.toLowerCase()))return err('Já existe um serviço com esse nome.');
  const t=String(f.pb==null?'':f.pb).trim(),pb=t===''?null:num(t);if(pb!==null&&!(pb>=0))return err('Informe um preço base de R$ 0 ou mais (ou deixe em branco).');

 toggleEt(s,sid,eid){const v=s.serv.find(x=>x.id===sid);if(!v)return err('Serviço não encontrado.');if(!s.etp.find(e=>e.id===eid))return err('Item não encontrado.');v.et=v.et||[];v.et=v.et.includes(eid)?v.et.filter(x=>x!==eid):[...v.et,eid];return{ok:true}},
 addEtp(s,f){const n=(f.n||'').trim();if(!n)return err('Informe o nome do item (ex.: Aspiração).');if(s.etp.some(e=>e.n.toLowerCase()===n.toLowerCase()))return err('Já existe um item com esse nome.');const t=String(f.custo==null?'':f.custo).trim(),c=t===''?0:num(t);if(!(c>=0))return err('O custo por uso deve ser R$ 0 ou mais.');const id=Core.id();s.etp.push({id,n,custo:c});return{ok:true,id}},
 editEtp(s,id,f){const e=s.etp.find(x=>x.id===id);if(!e)return err('Item não encontrado.');const n=(f.n==null?e.n:String(f.n)).trim();if(!n)return err('Informe o nome do item.');if(s.etp.some(x=>x.id!==id&&x.n.toLowerCase()===n.toLowerCase()))return err('Já existe um item com esse nome.');let c=e.custo;if(f.custo!==undefined){const t=String(f.custo).trim();c=t===''?0:num(t);if(!(c>=0))return err('O custo por uso deve ser R$ 0 ou mais.')}e.n=n;e.custo=c;return{ok:true}},

const soD=v=>String(v||'').replace(/\D/g,'');
function cpfOk(v){const d=soD(v);if(d.length!==11||/^(\d)\1+$/.test(d))return false;for(let t=9;t<11;t++){let s=0;for(let i=0;i<t;i++)s+=+d[i]*(t+1-i);if(((s*10)%11)%10!==+d[t])return false}return true}
function cnpjOk(v){const d=soD(v);if(d.length!==14||/^(\d)\1+$/.test(d))return false;const c=(n)=>{const w=n===12?[5,4,3,2,9,8,7,6,5,4,3,2]:[6,5,4,3,2,9,8,7,6,5,4,3,2];let s=0;for(let i=0;i<n;i++)s+=+d[i]*w[i];const r=s%11;return r<2?0:11-r};return c(12)===+d[12]&&c(13)===+d[13]}

function renavamOk(v){let d=soD(v);if(d.length<9||d.length>11)return false;d=d.padStart(11,'0');return renavamDV(d.slice(0,10))===+d[10]}

function telaUI(id,c,m){const u=S.usr.find(x=>x.id===id);act(Core.setTela(S,id,c,m),{h:'Voltou ao padrão do cargo',a:'Liberou',d:'Negou'}[m]+' a tela '+c+' para '+u.nome,{tela:'3301',alvo:id})}
// ---------- 3302 cargos ----------
function vCargos(){const sel=ui.cgs?S.cargos.find(c=>c.id===ui.cgs):null;
 return `<div class="hd"><div><h1>Cargos e permissões</h1><p class="sub" style="margin:0">Um cargo é um conjunto de telas. Mude aqui e todos com esse cargo recebem o acesso na hora.</p></div>${ui.cgn?'':'<button class="p" onclick="ui.cgn=1;draw()">Novo cargo</button>'}</div>
 ${ui.cgn?`<div class="card pop"><div class="row"><label>Nome do cargo<input id="cg_n" placeholder="Ex.: Recepção"></label><label>Copiar telas de<select id="cg_b"><option value="">Começar vazio</option>${S.cargos.filter(c=>!c.admin).map(c=>`<option value="${c.id}">${esc(c.nome)}</option>`).join('')}</select></label><label class="w">Descrição<input id="cg_d" placeholder="Ex.: atende clientes e agenda lavagens"></label></div><p id="cgerr" class="bad" role="alert"></p><div class="row"><button class="p" onclick="addCargoUI()">Criar cargo</button><button class="s" onclick="ui.cgn=0;draw()">Cancelar</button></div></div>`:''}
 <div class="pgrid">${S.cargos.map(c=>{const n=S.usr.filter(u=>u.cargo===c.id).length;return `<button class="card cgc${ui.cgs===c.id?' sel':''}" onclick="ui.cgs=${ui.cgs===c.id?"''":"'"+c.id+"'"};draw()"><div class="hd"><b>${esc(c.nome)}</b>${c.admin?'<span class="badge ok">Acesso total</span>':`<span class="mut">${c.telas.length} telas</span>`}</div><div class="mut">${esc(c.d||'')}</div><div class="cgs">${SETORES.map(x=>{const k=c.admin?TELAS.filter(t=>t.s===x.s).length:c.telas.filter(t=>t.startsWith(x.s)).length;return k?`<span class="chip s-${x.k}">${x.n} ${k}</span>`:''}).join('')}</div><small class="mut">${n} ${n===1?'usuário':'usuários'}</small></button>`}).join('')}</div>
 ${sel?`<div class="card"><div class="hd"><div><b>${esc(sel.nome)}</b><div class="mut">Toque nas telas para liberar ou tirar deste cargo.</div></div><span>${sel.id!=='adm'?`<button class="l d" onclick="twice('cgd${sel.id}',()=>delCargoUI('${sel.id}'))">${lbl('cgd'+sel.id,'Excluir cargo')}</button>`:''}<button class="l" onclick="ui.cgs='';draw()">Fechar</button></span></div>
 ${sel.admin?'<p class="ok">Administrador: acesso total a todas as telas, inclusive usuários, cargos e backup.</p>':SETORES.map(x=>{const L=TELAS.filter(t=>t.s===x.s),all=L.every(t=>sel.telas.includes(t.c));return `<div class="grp">${x.s} · ${x.n} <button class="l" onclick="cgSetor('${sel.id}','${x.s}',${!all})">${all?'tirar todas':'liberar todas'}</button></div><div class="tg">${L.map(t=>`<label class="tgi${sel.telas.includes(t.c)?' on':''}"><input type="checkbox" ${sel.telas.includes(t.c)?'checked':''} onchange="cgTela('${sel.id}','${t.c}')"><b>${t.c}</b> ${esc(t.n)}</label>`).join('')}</div>`}).join('')}</div>`:''}`}
function addCargoUI(){const b=$('cg_b').value,base=b?S.cargos.find(c=>c.id===b).telas:[],r=Core.addCargo(S,{nome:$('cg_n').value,d:$('cg_d').value,telas:base});if(!r.ok){$('cgerr').textContent=r.e;return}ui.cgn=0;ui.cgs=r.id;act(r,'Criou o cargo '+T_($('cg_n').value),{tela:'3302'})}
function cgTela(id,code){const c=S.cargos.find(x=>x.id===id),on=c.telas.includes(code);act(Core.togCargoTela(S,id,code),(on?'Tirou':'Liberou')+' a tela '+code+(on?' do':' no')+' cargo '+c.nome,{tela:'3302'})}
function cgSetor(id,s,on){const c=S.cargos.find(x=>x.id===id),L=TELAS.filter(t=>t.s===s).map(t=>t.c);c.telas=on?[...new Set([...c.telas,...L])]:c.telas.filter(x=>!L.includes(x));act({ok:true},(on?'Liberou':'Tirou')+' todas as telas de '+SN(s)+(on?' no':' do')+' cargo '+c.nome,{tela:'3302'})}
function delCargoUI(id){const c=S.cargos.find(x=>x.id===id);if(act(Core.delCargo(S,id),'Excluiu o cargo '+c.nome,{tela:'3302'}))ui.cgs=''}
// ---------- 3303 registro de alterações ----------
function vAud(){const f=ui.af||(ui.af={u:'',s:'',p:'7',q:''}),q=normT(f.q),lim=f.p==='tudo'?0:Date.now()-(+f.p)*864e5;
 const L=(S.aud||[]).filter(e=>(!f.u||e.u===f.u)&&(!f.s||String(e.tela).startsWith(f.s))&&e.t>=lim&&(!q||normT(e.acao+' '+e.un+' '+e.tela).includes(q))).sort((a,b)=>b.t-a.t);
 return `<h1>Registro de alterações</h1><p class="sub">Tudo que foi feito no sistema: quem, quando, em qual tela e o que mudou. Registros não podem ser apagados.</p>
 <div class="fbar"><div class="row"><select onchange="ui.af.u=this.value;draw()" aria-label="Usuário"><option value="">Todos os usuários</option>${S.usr.map(u=>`<option value="${u.id}" ${f.u===u.id?'selected':''}>${esc(u.nome)}</option>`).join('')}</select><select onchange="ui.af.s=this.value;draw()" aria-label="Setor"><option value="">Todos os setores</option>${SETORES.map(x=>`<option value="${x.s}" ${f.s===x.s?'selected':''}>${x.s} · ${x.n}</option>`).join('')}</select>
 <select onchange="ui.af.p=this.value;draw()" aria-label="Período">${[['1','Hoje'],['7','7 dias'],['30','30 dias'],['tudo','Tudo']].map(([k,n])=>`<option value="${k}" ${f.p===k?'selected':''}>${n}</option>`).join('')}</select><input type="search" placeholder="Buscar ação, pessoa ou tela" value="${esc(f.q)}" onchange="ui.af.q=this.value;draw()" aria-label="Buscar"></div></div>
 <p class="mut">${L.length} ${L.length===1?'registro':'registros'}${L.length>300?' · mostrando os 300 mais recentes':''}. Guardamos as últimas 3.000 alterações.</p>
 <div class="card feed">${L.slice(0,300).map(e=>{const t=telaDe(e.tela);return `<div class="fe"><i class="av">${ini(e.un)}</i><div><b>${esc(e.un)}</b> ${esc(e.acao)}${e.det&&e.det.length?`<ul>${e.det.map(d=>`<li>${esc(d[0])}: <s>${esc(fmtV(d[1]))}</s> → ${esc(fmtV(d[2]))}</li>`).join('')}</ul>`:''}<small>${t?`<span class="chip s-${SK(t.s)}">${t.c} ${esc(t.n)}</span> `:''}${new Date(e.t).toLocaleString('pt-BR',{dateStyle:'short',timeStyle:'medium'})}</small></div></div>`}).join('')||'<p class="mut">Nenhum registro neste filtro.</p>'}</div>`}
// ---------- 3304 dados e sistema ----------
function vSys(){return `<h1>Dados e sistema</h1><p class="sub">Backup de tudo (lavação, veículos, leads, financeiro, usuários e registros), cópias automáticas e dados da empresa.</p>
 <div class="card"><div class="lab">Empresa</div><div class="row"><label>Nome da empresa<input id="sy_emp" value="${esc(S.cfg.empresa||'')}"></label><label>Bloquear sessão após (minutos sem uso)<input id="sy_lk" inputmode="numeric" value="${S.cfg.lockMin||30}"></label><button class="s w" onclick="saveSys()">Salvar</button></div></div>
 ${bkCard()}${vDados()}${vSistema()}
 <div class="card tint"><b>Sobre a segurança deste modo local</b><p class="mut" style="margin:4px 0 0">As senhas são guardadas cifradas (PBKDF2) e cada ação fica registrada. Mas os dados ficam neste navegador: quem tiver acesso ao aparelho e conhecimento técnico consegue ler o armazenamento. Para dados financeiros sensíveis e acesso de vários aparelhos, o próximo passo é hospedar o sistema com um servidor e banco de dados.</p></div>`}
function saveSys(){const e=T_($('sy_emp').value),lk=num($('sy_lk').value);if(!(Number.isInteger(lk)&&lk>=5&&lk<=480))return toast('Bloqueio: de 5 a 480 minutos.',false);const de={e:S.cfg.empresa,l:S.cfg.lockMin||30};S.cfg.empresa=e;S.cfg.lockMin=lk;act({ok:true},'Alterou os dados da empresa',{tela:'3304',det:Core.diff(de,{e,l:lk},[['e','Empresa'],['l','Bloqueio (min)']])})}
const RENDER={'0000':vFin0,'0001':vFin1,'0002':vFin2,'0003':vFin3,'0004':vFin4,'1100':vGeral,'1102':v1102,'1103':v1103,'1104':vEstoque,'1105':vProd,'1106':vServ,'1107':vDesl,'1108':vFid,'2200':vMkt0,'2201':vLeads,'3300':vAdm0,'3301':vUsr,'3302':vCargos,'3303':vAud,'3304':vSys,'4400':vCmp0,'4401':vEntrada,'4402':vPrep,'5500':vVei0,'5501':vEstq,'5502':vVenda,'5503':vVendas};
// ===== Inicialização e atalhos =====
if(S.usr.length)Core.ensureCargos(S);
sesRead();if(SID)abasLoad();
draw();
document.addEventListener('focusin',e=>{const t=e.target;if(t.matches&&t.matches('input[inputmode]'))setTimeout(()=>t.select&&t.select(),0)});
document.addEventListener('keydown',e=>{const t=e.target,typing=t.matches&&t.matches('input,textarea,select,[contenteditable]');
 if(document.body.classList.contains('auth')){if(e.key==='Enter'&&t.tagName==='INPUT'){e.preventDefault();const b=document.querySelector('.authc button.p');if(b&&!b.disabled)b.click()}return}
 if(!U())return;
 if(e.key==='Enter'&&t.tagName==='INPUT'&&/^f_/.test(t.id||'')){e.preventDefault();saveProd();return}
 if(e.key==='Enter'&&t.tagName==='INPUT'&&/^c_/.test(t.id||'')){e.preventDefault();saveCli();return}
 if(e.key==='Enter'&&(t.id==='et_n'||t.id==='et_c')){e.preventDefault();saveEtp();return}
 if(e.key==='Escape'){if(ui.pal)return closePal();if(ui.sq)return closeQuote();if(ui.ps){ui.ps=false;return draw()}if(ui.me){ui.me=false;return draw()}if(ui.vf){ui.vf='';return draw()}if(ui.dlg){ui.dlg=null;return draw()}if(ui.sh)return closeSheet();if(ui.dr)return toggleDrawer();
  if(ui.form||ui.edit||ui.cf||ui.cform||ui.cedit||ui.sform||ui.unew||ui.fnew||ui.lnew||ui.led){Object.assign(ui,{edit:'',form:false,cf:false,cform:false,cedit:'',sform:false,unew:0,fnew:0,lnew:0,led:''});draw()}return}
 if(e.altKey&&!e.ctrlKey&&!e.metaKey){if(e.key==='ArrowLeft'){e.preventDefault();return stepTab(-1)}if(e.key==='ArrowRight'){e.preventDefault();return stepTab(1)}const k=e.key.toLowerCase();if(k==='w'&&cur!=='home'){e.preventDefault();return closeTab(cur)}if(k==='h'){e.preventDefault();return abrir('home')}}
 if(typing||ui.pal||ui.sh||ui.sq||ui.vf||ui.me)return;
 if((e.key==='k'&&(e.ctrlKey||e.metaKey))||e.key==='/'){e.preventDefault();return openPal()}
 if(/^\d$/.test(e.key)&&!e.ctrlKey&&!e.metaKey&&!e.altKey){e.preventDefault();openPal(e.key)}});
// outra aba do mesmo navegador salvou: recarrega sem atropelar quem está digitando
addEventListener('storage',e=>{if(e.key!==KEY||!e.newValue)return;const r=Core.imp(e.newValue);if(!r.ok)return;S=r.s;if(SID&&!U())sesEnd();const a=document.activeElement;if(a&&a.matches&&a.matches('input,textarea,select')&&a.value){ui.pendR=true;return}draw()});
document.addEventListener('focusout',()=>{if(ui.pendR){ui.pendR=false;setTimeout(()=>{const a=document.activeElement;if(!(a&&a.matches&&a.matches('input,textarea,select')))draw();else ui.pendR=true},50)}});
try{if(localStorage.getItem('lav-hc')==='1')document.documentElement.classList.add('hc')}catch(e){}
if(BOOT.fix)save();if(BOOT.msg)toast(BOOT.msg,false);
</script></body></html>
