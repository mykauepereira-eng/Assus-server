};

/* ---------- pedaços reutilizados ---------- */
function av(c,big){const s=String(c.id||c.nome).split('').reduce((a,ch)=>a+ch.charCodeAt(0),0)%6+1;const ini=T.title(c.nome||'?').split(/\s+/).filter(w=>!/^(da|de|do|das|dos|e|dona|seu|dr\.?|dra\.?|sr\.?|sra\.?)$/i.test(w)).slice(0,2).map(w=>w[0]).join('').toUpperCase()||'?';return `<span class="av${big?' big':''}" style="background:var(--av${s})" aria-hidden="true">${E(ini)}</span>`}
const STL={hoje:['Deve pedir','pen'],atrasado:['Atrasado','warn'],sumido:['Sumido','bad'],emdia:['Em dia','ok'],novo:['Cliente novo',''],agendado:['Pedido feito','ok'],adiado:['Adiado','']};
function chipSt(pr){if(!pr)return '<span class="chip">Sem pedidos</span>';let[l,c]=STL[pr.st]||['',''];if(pr.st==='hoje')l=pr.dias<=0?'Deve pedir hoje':'Deve pedir amanhã';if(pr.st==='novo'&&pr.due)l='Novo · deve voltar';return `<span class="chip ${c}">${l}</span>`}
function confM(c){const n=Math.max(1,Math.round(c*5));const t=c>=.7?'alta':c>=.4?'média':'baixa';return `<span class="cf" title="Confiança ${t} (${Math.round(c*100)}%)" role="img" aria-label="Confiança ${t}">${[1,2,3,4,5].map(i=>`<i class="${i<=n?'on':''}"></i>`).join('')}</span>`}
function freq(pr){if(!pr)return '';if(pr.base==='geral')return 'só 1 pedido até agora';const d=Math.round(pr.est);return d===7?'pede toda semana':d===14||d===15?'pede a cada 15 dias':d>=28&&d<=31?'pede uma vez por mês':'pede a cada ~'+d+' dias'}
function quandoProx(pr,h){return pr.prox<h?T.quando(h,h):T.quando(pr.prox,h)}
function nomeMsg(c){return T.primeiro((c.apel&&c.apel[0])||c.nome)}
function compact(n){return n>=1000?'R$ '+T.num(n/1000,1)+' mil':T.brl(n)}
const FORMAS={pix:'Pix',dinheiro:'Dinheiro',cartao:'Cartão',fiado:'Fiado',boleto:'Boleto'};

/* ---------- mensagens prontas e WhatsApp ---------- */
const MSGS=[];
function regMsg(t){MSGS.push(t);return MSGS.length-1}
function waUrl(tel,txt){let d=String(tel||'').replace(/\D/g,'');if(d.length===10||d.length===11)d='55'+d;return 'https://wa.me/'+d+'?text='+encodeURIComponent(txt)}
function btnWA(c,txt,label,cls){const k=regMsg(txt);if(c.tel)return `<a class="btn wa sm ${cls||''}" href="${E(waUrl(c.tel,txt))}" target="_blank" rel="noopener" onclick="contato('${c.id}')">${I.wa}${E(label)}</a>`;return `<button class="btn wa sm ${cls||''}" onclick="copiarMsg(${k},'${c.id}')" title="Cliente sem WhatsApp: copia a mensagem">${I.copy}${E(label)}</button>`}
function vars(c,x){const h=HOJE();x=x||{};const sd=Core.saldo(S,c.id);return{nome:nomeMsg(c),itens:x.itens||'',valor:T.brl(x.valor!=null?x.valor:sd.total),dia:x.dia||'hoje',dias:x.dias!=null?x.dias:'',detalhe:sd.lista.map(p=>'pedido de '+T.ddmm(p.dt)).join(', '),pix:S.cfg.pix||'',pixtxt:S.cfg.pix?' Pix: '+S.cfg.pix+'.':'',negocio:S.cfg.nome||'',rep:S.cfg.rep||'seu representante',empresa:S.cfg.empresa||S.cfg.nome||'',prazo:x.prazo||c.prazo||'prazo combinado'}}
function tpl(k){return (S.cfg.tpl&&S.cfg.tpl[k])||(AGRO()?TPL_AGRO:TPL)[k]}
function msgLembrete(c,pr){const h=HOJE();if(AGRO()){const r=Rota.doCli(S,c);const pe=r&&Rota.proxEntrega(r,h,HM());return Core.fill(tpl(c.ret&&c.ret<=h?'retorno':'lembrete'),vars(c,{itens:T.itens(pr.cesta),dia:pe?T.quando(pe,h):quandoProx(pr,h),valor:pr.valor}))}return Core.fill(tpl('lembrete'),vars(c,{itens:T.itens(pr.cesta),dia:quandoProx(pr,h),valor:pr.valor}))}
function msgCobranca(c){return Core.fill(tpl('cobranca'),vars(c))}
function msgReativar(c,pr){return Core.fill(tpl('reativar'),vars(c,{itens:T.itens(pr.cesta),dias:pr.desde,valor:pr.valor}))}
function msgPed(k,p){const c=Core.cli(S,p.cid);return Core.fill(tpl(k),vars(c,{prazo:p.prazo,itens:T.itens(p.itens),valor:p.total,dia:T.quando(p.dt,HOJE())+(p.hora?' '+(/:/.test(p.hora)?'às '+p.hora:'de '+p.hora):'')}))}
function contato(cid){ui.canal='wa';const c=Core.cli(S,cid);if(c){c.ctt=HOJE();mudou();if(!ui.sheet)setTimeout(draw,400)}}
function copiarMsg(k,cid){copiar(MSGS[k]);if(cid){contato(cid);toast('Cliente sem WhatsApp cadastrado: mensagem copiada.')}}
function copiar(txt){try{navigator.clipboard.writeText(txt).then(()=>toast('Copiado.'),()=>mostrarTexto(txt))}catch(e){mostrarTexto(txt)}}
function mostrarTexto(txt,tit){openSheet('texto',{txt,tit:tit||'Copie o texto'})}

/* ---------- avisos ---------- */
function toast(m,ok=true,acts){const t=document.createElement('div');t.className='toast'+(ok?'':' bad');t.setAttribute('role','status');const s=document.createElement('span');s.textContent=m;t.appendChild(s);
  (acts||[]).forEach(([l,fn])=>{const b=document.createElement('button');b.textContent=l;b.onclick=()=>{fn();t.remove()};t.appendChild(b)});
  $('toasts').appendChild(t);const ttl=acts&&acts.length?7000:3200;setTimeout(()=>t.classList.add('out'),ttl-250);setTimeout(()=>t.remove(),ttl)}
function twice(k,fn){if(ui.arm===k){ui.arm='';fn()}else{ui.arm=k;redraw();setTimeout(()=>{if(ui.arm===k){ui.arm='';redraw()}},4000)}}
function redraw(){if(ui.sheet)drawSheet();draw()}
function feito(r,m,snap,acts){if(!r.ok){toast(r.e,false);return false}mudou();draw();if(ui.sheet)drawSheet();if(m)toast(m,true,[...(snap?[['Desfazer',()=>desfazer(snap)]]:[]),...(acts||[])]);return true}
function desfazer(snap){S=JSON.parse(snap);mudou();draw();if(ui.sheet)drawSheet();toast('Desfeito.')}
function snap(){return JSON.stringify(S)}

/* ---------- navegação ---------- */
const TABS_ALL=[['hoje','Hoje'],['clientes','Clientes'],['pedidos','Pedidos'],['rotas','Rotas'],['radar','Radar'],['ajustes','Ajustes']];
let TABS=TABS_ALL;
function abas(){TABS=TABS_ALL.filter(t=>t[0]!=='rotas'||temRotas()).map(([k,l])=>AGRO()?[k,{rotas:'Caminhões',radar:'Desempenho'}[k]||l]:[k,l]);return TABS}
function trocar(fn){const run=()=>{fn();animar()};if(document.startViewTransition&&!matchMedia('(prefers-reduced-motion: reduce)').matches){try{document.startViewTransition(run);return}catch(e){}}run()}
function go(t,keep){trocar(()=>{ui.tab=t;if(!keep)ui.cli=null;ui.arm='';try{if(location.hash!=='#'+t)history.replaceState(null,'','#'+t)}catch(e){}draw();window.scrollTo(0,0);$('main').focus({preventScroll:true})})}
function abrirCli(id){if(ui.sheet&&ui.sheet.type==='foco')closeSheet();trocar(()=>{ui.tab='clientes';ui.cli=id;ui.arm='';draw();window.scrollTo(0,0)})}
function pendencias(){const h=HOJE();return S.ped.filter(p=>p.st==='aberto'&&p.dt<=h).length+preds().filter(p=>p.st==='hoje'||p.st==='atrasado').length}
function drawNav(){const n=pendencias();abas();$('nav').innerHTML=`<div class="brand">Freguês${AGRO()?' <span style="color:var(--pen)">Agro</span>':''}<small>${E(AGRO()?[S.cfg.rep,S.cfg.empresa].filter(Boolean).join(' · ')||'Representante':S.cfg.nome||'Caderno de clientes')}</small></div>`+TABS.map(([k,l])=>`<button class="${ui.tab===k?'on':''}" onclick="go('${k}')" ${ui.tab===k?'aria-current="page"':''}>${I[k]}<span>${l}</span>${k==='hoje'&&n?`<span class="bd" aria-label="${n} pendências">${n}</span>`:''}</button>`).join('')+`<div class="store" id="store">${storeTxt()}</div>`}
function storeTxt(){if(S.demo)return I.spark+'<span>Caderno de exemplo: nada é salvo.</span>';if(Store.mode==='nuvem')return I.cloud+`<span>${Store.busy||Store.t?'Salvando…':Store.erro?'Sem conexão com a sua conta; ficou guardado neste aparelho.':'Salvo na sua conta Claude.'}</span>`;return I.device+'<span>Salvo neste aparelho. Faça backup em Ajustes.</span>'}
function drawStatus(){const s=$('store');if(s)s.innerHTML=storeTxt();if(ui.tab==='ajustes'&&!ui.sheet)draw()}
function draw(){
  if(MSGS.length>1500)MSGS.length=0;drawNav();drawQuick();
  $('banner').innerHTML=S.demo?`<div class="banner">${I.spark}<span><b>Caderno de exemplo.</b> Experimente falar ou escrever: o que você lançar aqui não fica salvo.</span><button class="btn p sm" onclick="comecar()">Começar o meu caderno</button></div>`:'';
  const v={hoje:vHoje,clientes:ui.cli?()=>vCliente(ui.cli):vClientes,pedidos:vPedidos,rotas:temRotas()?vRotas:vHoje,radar:vRadar,ajustes:vAjustes}[ui.tab]||vHoje;
  $('main').innerHTML=v();
}
function comecar(){S=Core.vazio();S.demo=false;PR=null;Store.last={};mudou();draw();toast('Caderno novo criado. Fale seu primeiro pedido.');setTimeout(()=>$('cap').focus(),50)}
function exemplo(){S=Demo.gerar(HOJE());PR=null;draw();toast('Exemplo carregado. Ele não é salvo.')}

/* ---------- HOJE ---------- */
function saud(){const h=new Date().getHours();return h<12?'Bom dia':h<18?'Boa tarde':'Boa noite'}
function vHoje(){
  const h=HOJE(),ps=preds();
  if(!S.cli.length)return vazioGeral();
  if(AGRO())return vHojeInterno();

  </div>`;
  if(temRotas())o+=secVisitas(h,true);
  if(fila.length){const cnt={};fila.forEach(f=>cnt[f.t]=(cnt[f.t]||0)+1);const nm={lembrete:['lembrete','lembretes'],cobranca:['cobrança','cobranças'],reativar:['reativação','reativações'],aniversario:['aniversário','aniversários']};
    o+=`<div class="sec"><div class="list"><div class="it"><span class="av" style="background:var(--wa-s);color:var(--wa)">${I.wa}</span><div class="bd"><div class="nm">${fila.length} mensage${fila.length===1?'m pronta':'ns prontas'} para mandar</div><div class="sub">${Object.entries(cnt).map(([k,v])=>v+' '+nm[k][v>1?1:0]).join(' · ')}. Escritas a partir do histórico de cada cliente.</div></div><div class="val"><button class="btn p sm" onclick="openSheet('fila')">Abrir fila</button></div></div></div></div>`}
  o+=`<section class="sec" id="s-ent"><div class="sh"><h2>${temRotas()?'Entregas de hoje':'Para entregar'}</h2><span class="n">${ent.length}</span></div>`+(ent.length?`<div class="list">${ent.map(p=>rowPed(p,'ent')).join('')}</div>`:`<div class="empty">Nenhuma entrega pendente para hoje.</div>`)+`</section>`;
  o+=`<section class="sec" id="s-deve"><div class="sh"><h2>Devem pedir</h2><span class="n">${deve.length}</span></div>`+(deve.length?`<div class="list">${deve.map(rowPrev).join('')}</div>`:`<div class="empty">Ninguém com pedido previsto para hoje. Veja os próximos dias no <button class="lnk" onclick="go('radar')">Radar</button>.</div>`)+`</section>`;
  if(S.cfg.cobranca)o+=`<section class="sec" id="s-rec"><div class="sh"><h2>A receber</h2><span class="n">${T.brl(totRec)}</span></div>`+(rec.length?`<div class="list">${rec.map(rowRec).join('')}</div>`:`<div class="empty">Ninguém devendo. Tudo recebido.</div>`)+`</section>`;
  if(aniv.length)o+=`<section class="sec"><div class="sh"><h2>Aniversário hoje</h2></div><div class="list">${aniv.map(c=>`<div class="it">${av(c)}<div class="bd"><div class="nm"><button class="lnk" onclick="abrirCli('${c.id}')">${E(c.nome)}</button>${I.cake}</div></div><span></span><div class="acts">${btnWA(c,Core.fill(tpl('aniversario'),vars(c)),'Dar parabéns')}</div></div>`).join('')}</div></section>`;
  if(sum.length)o+=`<section class="sec"><div class="sh"><h2>Sumidos</h2><span class="n">${sum.length}</span></div><div class="list">${sum.slice(0,5).map(rowSumido).join('')}</div></section>`;
  o+=`<section class="sec"><div class="sh"><h2>Próximos 7 dias</h2><span class="n">${prox.length}</span><div class="r"><button class="btn g sm" onclick="go('pedidos')">Ver pedidos</button></div></div>`+(prox.length?`<div class="list">${prox.map(p=>rowPed(p,'mini')).join('')}</div>`:`<div class="empty">Nenhum pedido marcado para a semana.</div>`)+`</section>`;
  if(notas.length)o+=`<section class="sec"><div class="sh"><h2>Anotações recentes</h2></div><div class="notas">${notas.map(n=>notaHtml(n,true)).join('')}</div></section>`;
  return o;
}

  const sub=mode==='hist'?E(T.itens(p.itens)):E(quando)+' · '+E(T.itens(p.itens));

/* fila de mensagens do dia */
function montarFila(){const h=HOJE(),out=[];const recente=(c,d)=>c.ctt&&U.diff(h,c.ctt)<d;
  for(const pr of preds()){const c=Core.cli(S,pr.cid);if(!c)continue;
    if((pr.st==='hoje'||pr.st==='atrasado'||(pr.st==='novo'&&pr.due))&&pr.cesta.length&&!recente(c,2))out.push({t:'lembrete',c,txt:msgLembrete(c,pr),why:pr.st==='atrasado'?'Pedido atrasado ('+freq(pr)+')':'Deve pedir '+(pr.dias<=0?'hoje':'amanhã')});
    if(pr.st==='sumido'&&!recente(c,7))out.push({t:'reativar',c,txt:msgReativar(c,pr),why:'Sem pedir '+T.ha(pr.desde)})}
  for(const c of S.cli){const sd=Core.saldo(S,c.id);const ent=sd.lista.filter(p=>p.st==='entregue');if(S.cfg.cobranca&&sd.entregue>0&&ent.length&&U.diff(h,ent[0].dt)>=3&&!recente(c,3))out.push({t:'cobranca',c,txt:msgCobranca(c),why:'Deve '+T.brl(sd.entregue)+' desde '+T.ddmm(ent[0].dt)});
    if(c.nasc===h.slice(5)&&!recente(c,1))out.push({t:'aniversario',c,txt:Core.fill(tpl('aniversario'),vars(c)),why:'Aniversário hoje'})}
  return out}

  if(q)L=L.filter(x=>U.key(x.c.nome).includes(q)||(x.c.apel||[]).some(a=>U.key(a).includes(q))||String(x.c.tel).includes(q.replace(/\D/g,'')||'#'));
  const f=ui.cf;L=L.filter(x=>f==='todos'||(f==='deve'&&x.pr&&(x.pr.st==='hoje'||(x.pr.st==='novo'&&x.pr.due)))||(f==='atrasado'&&x.pr&&x.pr.st==='atrasado')||(f==='sumido'&&x.pr&&x.pr.st==='sumido')||(f==='devendo'&&x.sd.total>0)||(f==='semmes'&&!S.ped.some(p=>p.cid===x.c.id&&p.st!=='cancelado'&&p.dt.slice(0,7)===h.slice(0,7))));

  if(pr){

      ${pr.cesta.length?`<ul>${pr.cesta.map(i=>`<li><span class="mk">${E(T.item(i))}</span>${i.tr>=.05?`<span class="tr up">▲ crescendo</span>`:i.tr<=-.05?`<span class="tr dn">▼ caindo</span>`:''}${i.freq<1?`<span class="chip">em ${Math.round(i.freq*100)}% dos pedidos</span>`:''}<span class="v">${T.brl(i.q*i.pu)}</span></li>`).join('')}</ul><div class="tot"><span class="mut">Valor provável</span><b>${T.brl(pr.valor)}</b></div>`:''}
      <div class="row">${pr.st!=='agendado'?`<button class="btn p sm" onclick="lancarPrevisto('${c.id}')">${I.plus}Lançar este pedido</button>`:''}${pr.cesta.length&&pr.st!=='agendado'?btnWA(c,msgLembrete(c,pr),'Perguntar no WhatsApp'):''}${pr.st!=='agendado'?`<button class="btn g sm" onclick="openSheet('adiar',{cid:'${c.id}'})">${I.clock}Adiar</button>`:''}${c.snz&&c.snz>h?`<button class="btn g sm" onclick="Core.cli(S,'${c.id}').snz='';mudou();draw()">Tirar adiamento (até ${T.ddmm(c.snz)})</button>`:''}</div>

  o+=`<section class="sec"><div class="sh"><h2>Histórico</h2><span class="n">${ps.length}</span></div>${ps.length?`<div class="list">${ps.slice(0,40).map(p=>rowPed(p,'hist')).join('')}</div>`:'<div class="empty">Sem pedidos ainda.</div>'}</section>`;

function vPedidos(){const h=HOJE();

  ${grupos.length?grupos.map(g=>`<section class="sec"><div class="sh"><h2>${E(g.l)}</h2><span class="n">${T.brl(g.ps.reduce((s,p)=>s+p.total,0))}</span></div><div class="list">${g.ps.map(p=>rowPed(p,'lista')).join('')}</div></section>`).join(''):`<div class="sec empty">${ui.pf==='abertos'?'Nada a entregar. Os pedidos novos aparecem aqui.':ui.pf==='receber'?'Ninguém devendo.':'Nenhum pedido ainda.'}</div>`}`}

/* ---------- RADAR ---------- */
function vendasMes(m,h){return U.r2(S.ped.filter(p=>p.st!=='cancelado'&&p.dt.slice(0,7)===m&&p.dt<=h).reduce((s,p)=>s+p.total,0))}
function prev30(h){const ps=preds();const fim=U.add(h,29);const conf=S.ped.filter(p=>p.st==='aberto'&&p.dt>=h&&p.dt<=fim).reduce((s,p)=>s+p.total,0);const hz=Predict.horizonte(S,h,30,ps);const prov=hz.reduce((s,x)=>s+x.valor*x.p,0);return{conf:U.r2(conf),prov:U.r2(prov),total:U.r2(conf+prov),n:hz.length}}
function vRadar(){const h=HOJE(),ps=preds();const d=U.dt(h);
  const meses=[];for(let k=5;k>=0;k--){const x=new Date(d.getFullYear(),d.getMonth()-k,1,12);meses.push(x.getFullYear()+'-'+U.pad(x.getMonth()+1))}
  const v=meses.map(m=>vendasMes(m,h));const cur=v[5],ant=v[4];
  // mesmo período do mês anterior, para comparar de forma justa
  const dia=d.getDate();const antPer=U.r2(S.ped.filter(p=>p.st!=='cancelado'&&p.dt.slice(0,7)===meses[4]&&+p.dt.slice(8)<=dia).reduce((s,p)=>s+p.total,0));
  const var_=antPer?(cur-antPer)/antPer:null;
  const p30=prev30(h);const receber=S.cli.reduce((s,c)=>s+Core.saldo(S,c.id).entregue,0);
  const ativos=ps.filter(p=>p.st!=='sumido').length;
  let o=`<div class="hd"><h1>Radar</h1><p>O que vem pela frente, calculado a partir do histórico de cada cliente.</p></div>
  <div class="strip">
   <div class="stat"><b>${compact(cur)}</b><span>vendido em ${T.MES[d.getMonth()]}</span>${var_!=null?`<span class="d ${var_>=0?'up':'dn'}">${var_>=0?'▲':'▼'} ${Math.round(Math.abs(var_)*100)}% vs. mesmo período de ${T.MESC[(d.getMonth()+11)%12]}</span>`:''}</div>
   <div class="stat"><b>${compact(p30.total)}</b><span>previsto para os próximos 30 dias</span><span class="d">${compact(p30.conf)} já confirmados</span></div>
   ${S.cfg.cobranca?`<div class="stat"><b>${compact(receber)}</b><span>a receber</span></div>`:''}
   <div class="stat"><b>${ativos}<span style="font:600 15px var(--body);color:var(--mut)"> / ${S.cli.length}</span></b><span>clientes ativos</span></div>
  </div>
  ${S.cfg.meta||temRotas()?`<section class="sec"><div class="sh"><h2>Meta e carteira do mês</h2></div>${secMeta()}</section>`+secEfic():''}
  <section class="sec"><div class="sh"><h2>Vendas por mês</h2></div><div class="chart">${chart(meses,v,p30)}<div class="legend"><span><i style="background:var(--bar)"></i>meses anteriores</span><span><i style="background:var(--pen)"></i>${T.MES[d.getMonth()]} até hoje</span><span><i style="background:var(--marker)"></i>previsão para 30 dias</span></div></div></section>`;
  if(!AGRO()){
  // agenda de 14 dias
  const hz=Predict.horizonte(S,h,14,ps).filter(x=>x.p>=.25);
  let ag='';for(let k=0;k<14;k++){const dd=U.add(h,k);const conf=S.ped.filter(p=>p.st==='aberto'&&(p.dt===dd||(k===0&&p.dt<h)));const prov=hz.filter(x=>x.dt===dd&&!conf.some(p=>p.cid===x.cid));if(!conf.length&&!prov.length)continue;
    ag+=`<div class="day"><div class="dl">${E(T.up1(T.quando(dd,h)).replace(/ \(.*\)/,''))}<small>${T.ddmm(dd)} · ${compact(conf.reduce((s,p)=>s+p.total,0)+prov.reduce((s,x)=>s+x.valor*x.p,0))}</small></div><div class="cs">${conf.map(p=>{const c=Core.cli(S,p.cid);return `<button class="pill" onclick="editarPed('${p.id}')">${I.ok.replace('<svg','<svg width="13" height="13"')}${E(c?c.nome:'?')} <small>${T.brl(p.total)}</small></button>`}).join('')}${prov.map(x=>{const c=Core.cli(S,x.cid);return `<button class="pill prov" onclick="abrirCli('${x.cid}')" title="Provável: ${Math.round(x.p*100)}%">${E(c?c.nome:'?')} <small>~${T.brl(x.valor)} · ${Math.round(x.p*100)}%</small></button>`}).join('')}</div></div>`}
  o+=`<div class="grid2"><section class="sec"><div class="sh"><h2>Próximos 14 dias</h2></div>${ag?`<div class="list">${ag}</div><p class="mut" style="font-size:12.5px;margin:8px 2px 0">Contorno amarelo é previsão (com a chance de acontecer); o resto já foi pedido.</p>`:'<div class="empty">Sem pedidos nem previsões para as próximas duas semanas.</div>'}</section>`;
  // produção da semana
  const PL=producao(h);const fq=fqt;
  o+=`<section class="sec"><div class="sh"><h2>Produção e compras da semana</h2></div>${PL.length?`<div class="tbl-w"><table><thead><tr><th>Produto</th><th class="n">Pedido</th><th class="n">Provável</th><th class="n">Preparar</th></tr></thead><tbody>${PL.map(e=>`<tr><td>${E(e.nome)}</td><td class="n">${fq(e.c,e.un)}</td><td class="n"><span class="mk">${fq(e.p,e.un)}</span></td><td class="n"><b>${fq(e.c+e.p,e.un)}</b></td></tr>`).join('')}</tbody></table></div><p class="mut" style="font-size:12.5px;margin:8px 2px 0">“Provável” soma a cesta de quem deve pedir nos próximos 7 dias, pesada pela chance de cada um pedir.</p>`:'<div class="empty">Nada previsto para a semana.</div>'}</section></div>`;
  }
  // quem mais compra (90 dias) e produtos
  const ini=U.add(h,-89);const porCli=new Map(),porProd=new Map();
  S.ped.filter(p=>p.st!=='cancelado'&&p.dt>=ini&&p.dt<=h).forEach(p=>{porCli.set(p.cid,(porCli.get(p.cid)||0)+p.total);p.itens.forEach(i=>{const e=porProd.get(i.nome)||{q:0,v:0,un:i.un};e.q+=i.q;e.v+=i.q*i.pu;porProd.set(i.nome,e)})});
  const tot=[...porCli.values()].reduce((s,x)=>s+x,0)||1;let acc=0;
  const CL=[...porCli.entries()].sort((a,b)=>b[1]-a[1]).map(([cid,v])=>{acc+=v;return{cid,v,cls:acc/tot<=.8||acc-v===0?'A':acc/tot<=.95?'B':'C'}});
  const mx=CL.length?CL[0].v:1;
  o+=`<div class="grid2"><section class="sec"><div class="sh"><h2>Quem mais compra · 90 dias</h2></div>${CL.length?`<div class="tbl-w"><table><thead><tr><th>Cliente</th><th>Curva</th><th></th><th class="n">Total</th></tr></thead><tbody>${CL.slice(0,12).map(x=>{const c=Core.cli(S,x.cid);return `<tr><td><button class="lnk" onclick="abrirCli('${x.cid}')">${E(c?c.nome:'?')}</button></td><td><span class="chip ${x.cls==='A'?'pen':x.cls==='B'?'':'mk'}">${x.cls}</span></td><td style="width:30%"><div class="bar"><i style="width:${Math.round(x.v/mx*100)}%"></i></div></td><td class="n">${T.brl(x.v)}</td></tr>`}).join('')}</tbody></table></div><p class="mut" style="font-size:12.5px;margin:8px 2px 0">Curva A: os clientes que juntos fazem 80% das vendas. Vale tratar com prioridade.</p>`:'<div class="empty">Sem vendas nos últimos 90 dias.</div>'}</section>`;
  const PP=[...porProd.entries()].sort((a,b)=>b[1].v-a[1].v);const mp=PP.length?PP[0][1].v:1;
  o+=`<section class="sec"><div class="sh"><h2>Produtos · 90 dias</h2></div>${PP.length?`<div class="tbl-w"><table><thead><tr><th>Produto</th><th class="n">Qtd.</th><th></th><th class="n">Total</th></tr></thead><tbody>${PP.slice(0,12).map(([n,e])=>`<tr><td>${E(n)}</td><td class="n">${T.num(e.q,1)}${e.un==='un'?'':' '+E(T.unLabel(e.un,e.q))}</td><td style="width:26%"><div class="bar"><i style="width:${Math.round(e.v/mp*100)}%"></i></div></td><td class="n">${T.brl(e.v)}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">Sem vendas nos últimos 90 dias.</div>'}</section></div>`;
  return o}
function producao(h){const prod=new Map();const add=(nome,un,q,k)=>{const key=nome+'|'+un;const e=prod.get(key)||{nome,un,c:0,p:0};e[k]+=q;prod.set(key,e)};
  S.ped.filter(p=>p.st==='aberto'&&p.dt<=U.add(h,6)).forEach(p=>p.itens.forEach(i=>add(i.nome,i.un,i.q,'c')));
  Predict.horizonte(S,h,7,preds()).forEach(x=>x.cesta.forEach(i=>add(i.nome,i.un,i.q*x.p,'p')));
  return [...prod.values()].sort((a,b)=>(b.c+b.p)-(a.c+a.p))}
function fqt(q,un){return q?T.num(un==='kg'||un==='L'?Math.round(q*2)/2:Math.round(q),1)+(un==='un'?'':' '+T.unLabel(un,q)):'—'}
function chart(meses,v,p30){const W=640,H=230,top=26,bot=34,l=12,r=12;const vals=[...v,p30.total];const max=Math.max(1,...vals)*1.12;const n=vals.length,bw=(W-l-r)/n;
  let g='';vals.forEach((val,i)=>{const x=l+i*bw+bw*.17,w=bw*.66,hh=Math.max(val>0?2:0,(val/max)*(H-top-bot)),y=H-bot-hh;const last=i===n-1,cur=i===n-2;
    const fill=last?'var(--marker)':cur?'var(--pen)':'var(--bar)';
    g+=`<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${w.toFixed(1)}" height="${hh.toFixed(1)}" rx="5" fill="${fill}"${last?' stroke="var(--marker-ink)" stroke-dasharray="4 3" stroke-width="1.2"':''}/>`;
    if(last&&p30.conf>0){const hc=(p30.conf/max)*(H-top-bot);g+=`<rect x="${x.toFixed(1)}" y="${(H-bot-hc).toFixed(1)}" width="${w.toFixed(1)}" height="${hc.toFixed(1)}" rx="5" fill="var(--pen)" opacity=".85"/>`}
    g+=`<text class="vl" x="${(x+w/2).toFixed(1)}" y="${(y-7).toFixed(1)}" text-anchor="middle">${val>=1000?T.num(val/1000,1)+' mil':T.num(Math.round(val),0)}</text>`;
    const lb=last?'30 dias':T.MESC[+meses[i].slice(5,7)-1];g+=`<text x="${(x+w/2).toFixed(1)}" y="${H-12}" text-anchor="middle">${lb}</text>`});
  g+=`<line x1="${l}" x2="${W-r}" y1="${H-bot}" y2="${H-bot}" stroke="var(--rule)"/>`;
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Vendas dos últimos 6 meses e previsão para os próximos 30 dias">${g}</svg>`}

function rotaInfo(d){const c=d.cli&&((d.cli.id&&Core.cli(S,d.cli.id))||Core.acharCli(S,d.cli.nome));const r=c?Rota.doCli(S,c):Rota.daCidade(S,d.cidade);if(!temRotas())return '';

function vAjustes(){const c=S.cfg;const tl={lembrete:'Reposição (cliente que deve pedir)',confirma:'Confirmação de pedido',retorno:'Retorno combinado',oferta:'Oferta de mix',caminho:'Saiu para entrega',cobranca:'Cobrança',reativar:'Cliente sumido',aniversario:'Aniversário'};

async function baixar(nome,txt,tipo){
  if(IA.dl){try{await IA.dl.save({filename:nome,data:new Blob([txt],{type:tipo})});toast('Arquivo salvo.');return}catch(e){if(e&&e.code==='declined')return}}
  if(!EMBED){try{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type:tipo}));a.download=nome;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},800);toast('Arquivo baixado.');return}catch(e){}}
  mostrarTexto(txt,'Copie e guarde este conteúdo')}
function exportar(){const o={...S};delete o.demo;baixar('fregues-backup-'+HOJE()+'.json',JSON.stringify(o),'application/json');S.cfg.bk=HOJE();mudou()}
function importar(inp){const f=inp.files&&inp.files[0];if(!f)return;const rd=new FileReader();rd.onload=()=>{const r=Core.importar(String(rd.result));inp.value='';if(!r.ok)return toast(r.e,false);openSheet('importar',{S:r.S})};rd.readAsText(f)}

const SR=window.SpeechRecognition||window.webkitSpeechRecognition;let rec=null;
const EXEMPLOS=PERFIL_ATUAL()==='agrotimbo'?['Amigo Fiel quer 6 sacos de ração cães e 20 de areia','Seu Ivo pediu 10 sacos de mineral, boleto 28/35','Pet Center quer o de sempre','Vida Animal não atendeu','Liguei pra Casa do Colono, pediu pra ligar quinta','Como está a meta?']:['Joana pediu 30 pães de queijo pra sexta, no pix','Marcos pagou 120','A padaria quer o de sempre pra amanhã','Quem está me devendo?','Café da Esquina 40 coxinhas toda segunda','Dona Lurdes prefere entrega de manhã'];
function grow(){const t=$('cap');t.style.height='auto';t.style.height=Math.min(196,t.scrollHeight)+'px'}
function hint(html,kind){$('hint').innerHTML=`<span class="dot ${kind||''}"></span><span>${html}</span>`}
function hintPadrao(){hint(SR||!EMBED?(AGRO()?'Fale ou escreva: pedido, resultado do contato, anotação ou pergunta.':'Fale ou escreva: pedido, pagamento, entrega, anotação ou pergunta.'):'Escreva aqui, ou toque no microfone do teclado do celular para ditar.')}
function micUI(){const m=$('mic');const fb=$('fab');if(fb){fb.classList.toggle('on',ui.ouvindo);fb.innerHTML=ui.ouvindo?I.stop:I.mic}m.classList.toggle('on',ui.ouvindo);m.innerHTML=ui.ouvindo?I.stop:I.mic;m.setAttribute('aria-label',ui.ouvindo?'Parar de ouvir':'Falar');if(!ui.ouvindo)hintPadrao()}
function dicaVoz(bloq){hint(bloq?'O microfone não está liberado aqui. Toque no <b>microfone do teclado</b> do celular e dite na barra, ou abra o Freguês direto no navegador.':'Este navegador não tem ditado embutido. Use o <b>microfone do teclado</b> do celular para ditar na barra.');$('cap').focus()}
function ouvir(){
  if(ui.ouvindo){try{rec&&rec.stop()}catch(e){}return}
  if(!SR)return dicaVoz(false);
  try{rec=new SR()}catch(e){return dicaVoz(true)}
  rec.lang='pt-BR';rec.interimResults=true;rec.continuous=false;rec.maxAlternatives=1;
  const base=$('cap').value.trim();let fin='';
  if(!ui.tCap)ui.tCap=Date.now();ui.vozUlt=true;rec.onresult=e=>{let tmp='';for(let i=e.resultIndex;i<e.results.length;i++){const r=e.results[i];if(r.isFinal)fin+=r[0].transcript+' ';else tmp+=r[0].transcript}$('cap').value=((base?base+' ':'')+fin+tmp).replace(/\s+/g,' ').trimStart();grow()};
  rec.onerror=e=>{ui.ouvindo=false;micUI();if(/not-allowed|service-not-allowed|audio-capture/.test(e.error))dicaVoz(true);else if(e.error==='no-speech')hint('Não ouvi nada. Toque no microfone e fale de novo.');else if(e.error!=='aborted')hint('O ditado parou ('+E(e.error)+'). Tente de novo.')};
  rec.onend=()=>{const was=ui.ouvindo;ui.ouvindo=false;micUI();if(was&&fin.trim()&&S.cfg.falaAuto&&$('cap').value.trim())enviar()};
  try{rec.start();ui.ouvindo=true;micUI();hint('Ouvindo… fale o pedido. Ex.: <b>“Joana pediu 30 pães de queijo pra sexta”</b>','rec')}catch(e){dicaVoz(true)}
}
async function enviar(){
  const t=$('cap'),txt=t.value.trim();if(!txt||ui.busy)return;ui.t0=ui.tCap||Date.now();ui.tCap=0;ui.voz=!!ui.vozUlt;ui.vozUlt=false;
  const h=HOJE();let ds=P.multi(txt,S,h,HM());if(!ds.length)return;
  t.value='';grow();
  if(ds.length===1&&ds[0].tipo==='consulta')return responder(ds[0]);
  const fraco=ds.some(d=>d.conf<.75);
  if(IA.s&&S.cfg.ia&&fraco){ui.drafts=ds;openSheet('prev',{carregando:true,txt});const ai=await iaInterpretar(txt);if(ai&&ai.length&&ui.sheet&&ui.sheet.type==='prev'&&!ui.sheet.mexeu){ui.drafts=ai;ui.sheet.carregando=false;ui.sheet.ia=true;drawSheet()}else if(ui.sheet&&ui.sheet.type==='prev'){ui.sheet.carregando=false;drawSheet()}return}
  if(S.cfg.autoSalvar&&ds.length===1&&autoOk(ds[0])){ui.drafts=ds;return salvarDraft(0,true)}
  ui.drafts=ds;openSheet('prev',{txt});
}
function autoOk(d){if(!d.cli||!d.cli.id||d.conf<.85)return false;if(d.tipo==='pedido')return d.itens.length&&d.itens.every(i=>i.pid&&i.pu!=null);return d.tipo==='pagamento'||d.tipo==='nota'}
async function iaInterpretar(txt){
  const h=HOJE();ui.ctl=new AbortController();hint('Entendendo com o Claude…','busy');
  const cl=S.cli.slice(0,400).map(c=>c.id+'|'+c.nome+(c.apel&&c.apel.length?'|'+c.apel.join(', '):'|')+(c.cidade?'|'+c.cidade:'')).join('\n');
  const pr=S.prod.slice(0,300).map(p=>p.nome+'|'+p.un+'|'+p.preco).join('\n');
  const prompt=`Você converte o que um vendedor autônomo brasileiro falou ou digitou em lançamentos para o caderno de clientes dele.
Hoje é ${T.DIA[U.dow(h)]}, ${h}.
Clientes cadastrados (id|nome|apelidos|cidade):
${cl||'(nenhum)'}
Produtos (nome|unidade|preço):
${pr||'(nenhum)'}

Texto: """${txt.slice(0,4000)}"""

Responda só com JSON neste formato:
{"comandos":[{"tipo":"pedido|pagamento|entrega|nota|cliente|cancelar|consulta","cliente_id":"id do cadastro ou null","cliente_nome":"nome como foi dito","itens":[{"produto":"nome do catálogo quando for o mesmo produto","qtd":1,"un":"un|kg|g|L|ml|dz|cx|pct|cento","preco_unit":null}],"total":null,"data":"AAAA-MM-DD ou null","hora":"HH:MM ou null","repetir_dias":null,"pagamento":"pix|dinheiro|cartao|fiado ou null","pago":null,"valor":null,"telefone":null,"endereco":null,"cidade":null,"prazo":null,"texto":null,"de_sempre":false}]}
Regras: um comando por ação citada. Use o id do cliente quando o nome ou apelido bater, mesmo com erro de ditado. "de_sempre" é true quando a pessoa pede "o de sempre", "o mesmo" ou "repete". Converta datas relativas (amanhã, sexta, dia 20) em datas reais a partir de hoje. "pago" é true se já pagou. "valor" é o valor recebido num pagamento. Em "nota", "cliente" e "consulta", ponha a frase em "texto". Não invente itens, preços nem clientes. "cidade" é a cidade do cliente quando dita; "prazo" é o prazo de pagamento (ex.: "28 dias", "28/35/42 dias", "à vista").`;
  try{const out=await IA.s.json(prompt,{modelTier:'quick',signal:ui.ctl.signal});const cmds=Array.isArray(out)?out:out&&out.comandos;hintPadrao();return(cmds||[]).map(x=>P.deIA(x,S,h,txt,HM())).filter(Boolean)}
  catch(e){hintPadrao();iaErro(e);return null}}
function iaErro(e){const c=e&&e.code;if(c==='cancelled')return;if(c==='not_granted'||c==='sampling_disabled'||c==='not_declared'||c==='capability_disabled'||c==='capability_removed'){IA.s=null;toast('O Claude não está liberado aqui. Sigo com o intérprete do aparelho.',false)}else if(c==='rate_limited')toast('Muitos pedidos ao Claude agora. Sigo com o intérprete do aparelho.',false);else toast('Não consegui falar com o Claude. Sigo com o intérprete do aparelho.',false)}

function responder(r){const h=HOJE();const loc=respostaLocal(r,h);
  if(loc){openSheet('resp',{q:r.fala,html:loc});return}
  if(IA.s&&S.cfg.ia){openSheet('resp',{q:r.fala,html:'',txt:'Pensando…',ia:true});perguntarIA(r.fala);return}
  openSheet('resp',{q:r.fala,html:`<p>Ainda não sei responder essa. Experimente:</p><p>“quando a Joana pede de novo?” · “quanto a Bia me deve?” · “quem está devendo?” · “quem deve pedir essa semana?” · “quanto vendi esse mês?” · “o que preparar essa semana?”</p>`})}
function respostaLocal(r,h){const n=U.norm(r.fala);const c=r.cli&&r.cli.id?Core.cli(S,r.cli.id):null;
  if(temRotas()&&!c){const alvo=/\bamanha\b/.test(n)?diaUtil(U.add(h,1)):(()=>{const m=/\b(segunda|terca|quarta|quinta|sexta|sabado)\b/.exec(n);if(!m)return h;const w={segunda:1,terca:2,quarta:3,quinta:4,sexta:5,sabado:6}[m[1]];return U.add(h,(w-U.dow(h)+7)%7)})();
    if(/\b(visit\w*|roteiro|passar|ligar|ligo|fila)\b/.test(n)){const{rs,L}=visitasDoDia(alvo);if(!rs.length)return `<p>Nenhuma rota de visita em ${T.quando(alvo,h)}.</p>`;const top=[...L].sort((a,b)=>b.sc-a.sc).slice(0,8);return `<p>${T.up1(T.quando(alvo,h))}: rota <b>${E(rs.map(x=>x.nome).join(' + '))}</b>, ${L.length} clientes. Prioridade:</p><p>${top.map(x=>`${E(x.c.nome)} (${E(x.c.cidade||'')}) · ${E(x.why.map(w=>w[0]).join(', '))}`).join('<br>')}</p><p><a href="${E(mapsUrl(Geo.ordem(S.cfg.base||'Timbó',L.map(x=>x.c.cidade).filter(Boolean))))}" target="_blank" rel="noopener">Abrir a rota no Google Maps</a></p>`}
    if(/\b(carga|caminhao|peso|expedicao)\b/.test(n)){const dias=Rota.proximosDias(S,h,4).filter(x=>x.rs.length);return `<p>${dias.map(x=>{const G=cargaDoDia(x.d);return `<b>${E(T.up1(T.quando(x.d,h)))}</b>: ${G.map(g=>`${E(g.r?g.r.nome:'sem rota')} ${g.ps.length} pedido${g.ps.length===1?'':'s'}, ${T.num(g.peso,0)} kg${g.frio.length?', '+g.frio.length+' com frio':''}`).join(' · ')}`}).join('<br>')}</p>`}
    if(/\b(meta|comissao|positiv\w*)\b/.test(n)){const m=metaInfo();return `<p>Vendido no mês: <b>${T.brl(m.vend)}</b>${m.meta?` de ${T.brl(m.meta)} (${Math.round(m.pct*100)}%). Faltam ${T.brl(m.falta)}, cerca de ${T.brl(m.porDia)} por dia útil`:''}.</p><p>Positivação: ${m.pos} de ${m.ativos} clientes ativos (${Math.round(m.posPct*100)}%). Mix médio ${T.num(m.mix,1)} categorias.${S.cfg.comissao?` Comissão estimada ${T.brl(m.com)}.`:''}</p>`}
  }
  if(c){const pr=predOf(c.id),sd=Core.saldo(S,c.id),nm=`<b>${E(c.nome)}</b>`;
    if(/\b(deve|devendo|saldo|em aberto|divida|pagou|pago|me paga)\b/.test(n))return sd.total>0?`<p>${nm} deve <b>${T.brl(sd.total)}</b>.</p><p>${sd.lista.map(p=>`Pedido de ${T.ddmm(p.dt)} (${E(T.itens(p.itens))}): falta ${T.brl(Core.devido(p))}${p.st==='entregue'?'':' · ainda não entregue'}`).join('<br>')}</p>`:`<p>${nm} não deve nada.</p>`;
    if(!pr)return `<p>${nm} ainda não tem pedidos.</p>`;
    if(/\b(ultim[oa]|ultima vez)\b/.test(n)){const u=Core.ultimo(S,c.id);return `<p>O último pedido de ${nm} foi ${T.quando(u.dt,h)} (${T.ddmm(u.dt)}): ${E(T.itens(u.itens))}, ${T.brl(u.total)}.</p>`}
    return `<p>${nm} deve pedir <b>${E(quandoProx(pr,h))}</b>${pr.st==='atrasado'?' (já está atrasado)':pr.st==='sumido'?' — mas está sumido: o último pedido foi '+T.ha(pr.desde):''}. ${T.up1(freq(pr))}; o último foi ${T.ha(pr.desde)}.</p>${pr.cesta.length?`<p>Provavelmente vai querer <span class="mk">${E(T.itens(pr.cesta))}</span>, cerca de <b>${T.brl(pr.valor)}</b>.</p>`:''}${sd.total>0?`<p>Tem ${T.brl(sd.total)} em aberto.</p>`:''}`}
  if(/\bquem\b/.test(n)&&/\b(deve|devendo|pagou)\b/.test(n)){const L=S.cli.map(c=>({c,v:Core.saldo(S,c.id).entregue})).filter(x=>x.v>0).sort((a,b)=>b.v-a.v);return L.length?`<p>${L.length} cliente${L.length>1?'s devem':' deve'} ${T.brl(L.reduce((s,x)=>s+x.v,0))} no total:</p><p>${L.map(x=>`${E(x.c.nome)}: <b>${T.brl(x.v)}</b>`).join('<br>')}</p>`:'<p>Ninguém está devendo.</p>'}
  if(/\bquem\b/.test(n)&&/\b(ped|compr|quer|vai)\w*/.test(n)){const lim=/\bamanha\b/.test(n)?1:/\bhoje\b/.test(n)?0:6;const L=preds().filter(p=>p.st!=='agendado'&&p.st!=='sumido'&&U.diff(p.prox,h)<=lim).sort((a,b)=>a.prox<b.prox?-1:1);return L.length?`<p>Devem pedir ${lim===0?'hoje':lim===1?'até amanhã':'nos próximos 7 dias'}:</p><p>${L.map(p=>`${E(Core.cli(S,p.cid).nome)} · ${E(quandoProx(p,h))} · ≈ ${T.brl(p.valor)}`).join('<br>')}</p>`:'<p>Ninguém previsto nesse período.</p>'}
  if(/\b(sumid|parou|parad|nao compra|sem comprar)\w*/.test(n)){const L=preds().filter(p=>p.st==='sumido');return L.length?`<p>${L.map(p=>`${E(Core.cli(S,p.cid).nome)}: último pedido ${T.ha(p.desde)}`).join('<br>')}</p>`:'<p>Nenhum cliente sumido.</p>'}
  if(/\bquanto\b/.test(n)&&/\b(receber|me devem|na rua)\b/.test(n)){const v=S.cli.reduce((s,c)=>s+Core.saldo(S,c.id).entregue,0),ab=S.cli.reduce((s,c)=>s+Core.saldo(S,c.id).total,0)-v;return `<p>Você tem <b>${T.brl(v)}</b> a receber de pedidos já entregues${ab>0?`, e mais ${T.brl(ab)} em pedidos que ainda vão ser entregues`:''}.</p>`}
  if(/\bquanto\b/.test(n)&&/\b(vend\w*|fatur\w*|ganhei|entrou|recebi)\b/.test(n)){const ini=/\bhoje\b/.test(n)?h:/\bsemana\b/.test(n)?U.add(h,-((U.dow(h)+6)%7)):h.slice(0,8)+'01';const ps=S.ped.filter(p=>p.st!=='cancelado'&&p.dt>=ini&&p.dt<=h);const rc=S.rec.filter(x=>x.d>=ini&&x.d<=h).reduce((s,x)=>s+x.v,0);return `<p>${ini===h?'Hoje':'Desde '+T.ddmm(ini)} você vendeu <b>${T.brl(ps.reduce((s,p)=>s+p.total,0))}</b> em ${ps.length} pedido${ps.length===1?'':'s'} e recebeu ${T.brl(rc)}.</p>`}

async function perguntarIA(q){const h=HOJE();ui.ctl=new AbortController();

  for(const c of S.cli){const pr=predOf(c.id),st=Core.stats(S,c.id),sd=Core.saldo(S,c.id);L.push(`- ${c.nome}${c.apel&&c.apel.length?' ('+c.apel.join(', ')+')':''}: ${st.n} pedidos, total R$ ${st.total}, último ${st.ultimo||'-'}${pr?`, ${freq(pr)}, próximo previsto ${pr.prox} (${pr.st}), cesta provável: ${T.itens(pr.cesta)} ≈ R$ ${pr.valor}`:''}, deve R$ ${sd.total}`)}
  const d=U.dt(h);for(let k=5;k>=0;k--){const x=new Date(d.getFullYear(),d.getMonth()-k,1,12);const m=x.getFullYear()+'-'+U.pad(x.getMonth()+1);L.push(`Vendas ${m}: R$ ${vendasMes(m,h)}`)}
  S.ped.filter(p=>p.st==='aberto').sort((a,b)=>a.dt<b.dt?-1:1).slice(0,60).forEach(p=>{const c=Core.cli(S,p.cid);L.push(`Pedido aberto ${p.dt}: ${c?c.nome:'?'} · ${T.itens(p.itens)} · R$ ${p.total}`)});
  S.notas.slice(-40).forEach(nn=>{const c=nn.cid&&Core.cli(S,nn.cid);L.push(`Anotação ${nn.d}${c?' ('+c.nome+')':''}: ${nn.txt}`)});
  const prompt=`Você é o assistente do caderno de clientes de um vendedor autônomo. Responda em português do Brasil, curto e direto (até 6 linhas), usando só os dados abaixo. Se os dados não bastarem, diga isso.\n\nDados:\n${L.join('\n').slice(0,60000)}\n\nPergunta: ${q}`;
  try{await IA.s(prompt,{modelTier:'quick',signal:ui.ctl.signal,cache:false,onText:({text})=>{if(ui.sheet&&ui.sheet.type==='resp'){ui.sheet.txt=text;const el=$('resp-t');if(el)el.textContent=text}}})}

const Store={
  mode:'local',db:null,dev:'d'+U.uid(),last:{},t:null,busy:false,again:false,erro:'',pronto:false,LK:PERFIL_ATUAL()?'fregues-'+PERFIL_ATUAL()+':v1':'fregues:v1',

  partes(S){const P={base:{v:S.v,cfg:S.cfg,cli:S.cli,prod:S.prod}};const m=k=>P[k]||(P[k]={ped:[],notas:[],rec:[],ctt:[]});(S.ctt||[]).forEach(k=>m('m-'+String(k.d).slice(0,7)).ctt.push(k));S.ped.forEach(p=>m('m-'+p.dt.slice(0,7)).ped.push(p));S.notas.forEach(n=>m('m-'+String(n.d).slice(0,7)).notas.push(n));S.rec.forEach(r=>m('m-'+String(r.d).slice(0,7)).rec.push(r));return P},
  juntar(docs){const S2=Core.vazio();const b=docs.base||{};S2.cfg={...S2.cfg,...(b.cfg||{}),tpl:{...TPL,...((b.cfg||{}).tpl||{})}};S2.cli=b.cli||[];S2.prod=b.prod||[];for(const k in docs){if(!/^m-/.test(k))continue;const d=docs[k];S2.ped.push(...(d.ped||[]));S2.notas.push(...(d.notas||[]));S2.rec.push(...(d.rec||[]));S2.ctt.push(...(d.ctt||[]))}return S2},

  save(){if(S.demo)return;this.gravarLocal();if(this.db&&this.pronto){clearTimeout(this.t);this.t=setTimeout(()=>{this.t=null;this.flush()},700);drawStatusLeve()}},
  async flush(){if(!this.db)return;if(this.busy){this.again=true;return}this.busy=true;
    try{const P=this.partes(S);for(const k in P){const s=JSON.stringify(P[k]);if(this.last[k]!==s){await this.db.doc('crm/'+k).set({...JSON.parse(s),at:Date.now(),dev:this.dev});this.last[k]=s}}
      for(const k of Object.keys(this.last))if(!(k in P)){await this.db.doc('crm/'+k).delete();delete this.last[k]}this.erro=''}
    catch(e){this.erro=(e&&e.code)||'erro';if(e&&e.code==='quota_exceeded')toast('O espaço da sua conta para o Freguês encheu. Salve um backup e apague pedidos antigos.',false)}

  async conectar(){

    db.collection('crm').onSnapshot(snap=>{
      const docs={};snap.docs.forEach(d=>{if(d.exists)docs[d.id]=d.data()});
      if(!this.pronto){if(snap.metadata.fromCache)return;clearTimeout(timer);this.pronto=true;this.erro='';
        if(!docs.base){if(!S.demo&&(S.cli.length||S.ped.length))this.flush()}
        else this.aplicar(docs);
        drawStatusLeve();return}
      if(snap.metadata.hasPendingWrites||this.busy||this.t)return;
      const ext=snap.docChanges().some(ch=>{const d=ch.doc.data();return ch.type==='removed'||!d||d.dev!==this.dev});
      if(ext)this.aplicar(docs)
    },err=>{clearTimeout(timer);this.erro=(err&&err.code)||'erro';drawStatusLeve()})
  }
};

function resumoExpedicao(d,g){const h=HOJE();const cap=S.cfg.capacidade||0;const L=[`${g.r?'Rota '+g.r.nome:'Sem rota'} · ${T.quando(d,h)} ${T.ddmm(d)}`,`${g.ps.length} pedido${g.ps.length===1?'':'s'} · ${T.brl(g.valor)} · ${T.num(g.peso,0)} kg${cap?` (${Math.round(g.peso/cap*100)}% do caminhão)`:''}`];

function metaInfo(){const h=HOJE(),m=h.slice(0,7);const ps=S.ped.filter(p=>p.st!=='cancelado'&&(AGRO()?dRef(p):p.dt).slice(0,7)===m);const vend=U.r2(ps.reduce((s,p)=>s+p.total,0));
  const fim=(()=>{const d=U.dt(h);return U.iso(new Date(d.getFullYear(),d.getMonth()+1,0,12))})();let du=0;for(let d=h;d<=fim;d=U.add(d,1)){const w=U.dow(d);if(w>0&&w<6)du++}

  const meta=+S.cfg.meta||0;return{vend,meta,pct:meta?vend/meta:0,falta:Math.max(0,U.r2(meta-vend)),du,porDia:du?U.r2(Math.max(0,meta-vend)/du):0,pos:pos.size,ativos,posPct:ativos?pos.size/ativos:0,mix,com:U.r2(vend*(+S.cfg.comissao||0)/100)}}

// quem ligar no dia: clientes das rotas cujo caminhão sai no próximo dia útil (fechar antes do corte),
// rotas marcadas para ligar nesse dia, retornos agendados e quem a previsão diz que deve pedir
function visitasDoDia(d){const dow=U.dow(d),h=HOJE(),mes=h.slice(0,7);const prox=diaUtil(U.add(d,1));
  const rs=Rota.lista(S).filter(r=>(r.visita||[]).includes(dow)||(r.dias||[]).includes(U.dow(prox)));const ids=new Set(rs.map(r=>r.id));
  const L=S.cli.map(c=>{const r=Rota.doCli(S,c);const pr=predOf(c.id);const naRota=r&&ids.has(r.id);const ret=c.ret&&c.ret<=d;const due=pr&&(pr.st==='atrasado'||pr.st==='hoje'||(pr.st==='novo'&&pr.due)||(pr.st==='sumido'&&(!c.ctt||U.diff(d,c.ctt)>=7)));if(!naRota&&!ret&&!due)return null;
    const comprou=S.ped.some(p=>p.cid===c.id&&p.st!=='cancelado'&&p.dt.slice(0,7)===mes);let sc=0;const why=[];
    if(ret){sc+=6;why.push(['Retorno agendado','pen'])}
    if(pr){if(pr.st==='atrasado'){sc+=5;why.push(['Pedido atrasado','warn'])}else if(pr.st==='hoje'||(pr.st==='novo'&&pr.due)){sc+=4;why.push(['Deve pedir','pen'])}else if(pr.st==='sumido'){sc+=3;why.push(['Sumido','bad'])}else if(pr.st==='emdia'&&U.diff(pr.prox,d)<=4){sc+=2;why.push(['Pede '+T.quando(pr.prox,h),''])}else if(pr.st==='agendado'){sc-=2;why.push(['Pedido já feito','ok'])}}else{sc+=1;why.push(['Sem pedidos',''])}
    if(!comprou){sc+=1.5;why.push(['Sem compra no mês','mk'])}
    if(naRota&&r.dias.includes(U.dow(prox))){sc+=1;why.push(['Caminhão '+T.quando(prox,h),''])}
    if(S.notas.some(n=>n.cid===c.id&&U.diff(h,n.d)<=21))sc+=.5;
    const kd=(S.ctt||[]).filter(k=>k.cid===c.id&&k.d===d);const ult=kd[kd.length-1];if(ult&&ult.res!=='nao'){sc-=20;why.unshift([RES[ult.res]||'Contatado','ok'])}else if(ult){sc-=1;why.unshift(['Não atendeu ('+kd.length+'x)','warn'])}
    return{c,pr,sc,why,feito:!!(ult&&ult.res!=='nao')}}).filter(Boolean).sort((a,b)=>b.sc-a.sc);
  return{rs,L,ordem:Geo.ordem(S.cfg.base||'Timbó',L.map(x=>x.c.cidade).filter(Boolean))}}
const RES={pedido:'Fez pedido',sem:'Sem pedido agora',retorno:'Retornar',nao:'Não atendeu'};
function corteTxt(c){const r=Rota.doCli(S,c);if(!r||!r.corte)return '';const h=HOJE(),am=diaUtil(U.add(h,1));if(!(r.dias||[]).includes(U.dow(am)))return '';const[hh,mm]=r.corte.split(':').map(Number);const n=new Date();const fal=(hh*60+mm)-(n.getHours()*60+n.getMinutes());if(U.diff(am,h)!==1)return '';return fal>0?`Corte do caminhão de ${T.quando(am,h)} em ${fal>=60?Math.floor(fal/60)+'h'+U.pad(fal%60):fal+' min'}`:`Corte de hoje passou: entra no caminhão seguinte`}
function secVisitas(d,compacto){const{L}=visitasDoDia(d);const h=HOJE();if(!L.length&&!temRotas())return '';const pend=L.filter(x=>!x.feito);const N=compacto?6:L.length;
  const lista=compacto?pend.slice(0,N):L;
  return `<section class="sec"><div class="sh"><h2>${d===h?'Ligar hoje':'Contatos de '+T.quando(d,h)}</h2><span class="n">${pend.length} na fila · ${L.length-pend.length} feitos</span><div class="r">${pend.length&&d===h?`<button class="btn p sm glow" onclick="abrirFoco()">${I.play}Modo foco</button>`:''}${compacto?`<button class="btn g sm" onclick="ui.rd='${d}';go('rotas')">Ver todos</button>`:''}</div></div>
  ${L.length?`<div class="list">${lista.map(x=>`<div class="it${x.feito?' done':''}">${av(x.c)}<div class="bd"><div class="nm"><button class="lnk" onclick="abrirCli('${x.c.id}')">${E(x.c.nome)}</button>${x.why.slice(0,3).map(([t,k])=>`<span class="chip ${k}">${E(t)}</span>`).join('')}</div><div class="sub">${E(x.c.cidade||'sem cidade')}${x.pr?` · ${E(freq(x.pr))} · último ${T.ha(x.pr.desde)}`:''}${x.c.contato?' · falar com '+E(x.c.contato):''}</div>${x.pr&&x.pr.cesta.length&&!x.feito&&x.sc>=2?`<div class="ces">${x.pr.cesta.map(i=>`<span class="mk">${E(T.item(i))}</span>`).join('')}</div>`:''}</div><div class="val">${x.pr?'≈ '+T.brl(x.pr.valor):''}</div>${x.feito?'':`<div class="acts">${x.c.tel?`<a class="btn sm" href="tel:${E(x.c.tel)}" onclick="ui.canal='tel'">${I.phone}Ligar</a>`:''}${x.pr&&x.pr.cesta.length?btnWA(x.c,msgLembrete(x.c,x.pr),'WhatsApp'):''}<button class="btn sm" onclick="openSheet('resultado',{cid:'${x.c.id}'})">${I.ok}Resultado</button></div>`}</div>`).join('')}</div>${compacto&&pend.length>N?`<p class="mut" style="font-size:13px;margin:8px 2px 0">Mostrando os ${N} mais importantes de ${pend.length}. <button class="lnk" onclick="abrirFoco()">Fazer a fila no modo foco</button></p>`:''}`:`<div class="empty">Ninguém para contatar ${d===h?'hoje':'nesse dia'}.</div>`}</section>`}

function abrirFoco(){const{L}=visitasDoDia(HOJE());ui.fq=L.filter(x=>!x.feito).map(x=>x.c.id);ui.fi=0;ui.f0=Date.now();ui.fok=0;if(!ui.fq.length)return toast('Fila do dia concluída.');openSheet('foco',{})}
function shFoco(){const q=ui.fq||[];if(ui.fi>=q.length)return['Fila concluída',`<div class="done-card"><div class="big">${I.ok}</div><p><b>${ui.fok} contato${ui.fok===1?'':'s'}</b> em ${Math.max(1,Math.round((Date.now()-ui.f0)/60000))} min.</p><p class="mut">Os resultados entram no painel de eficiência do Radar.</p></div>`,`<button class="btn p" onclick="closeSheet();go('radar')">Ver eficiência</button>`];
  const c=Core.cli(S,q[ui.fi]);if(!c){ui.fi++;return shFoco()}const pr=predOf(c.id),h=HOJE();const ult=Core.ultimo(S,c.id);const nt=S.notas.filter(n=>n.cid===c.id).slice(-2);const ct=corteTxt(c);const r=Rota.doCli(S,c);

  <div class="foco-card"><div class="cli-h">${av(c,true)}<div><h1 style="font-size:26px">${E(c.nome)}</h1><div class="apel">${E([c.cidade,c.contato&&'falar com '+c.contato,c.tipo&&TIPOS_CLI[c.tipo]].filter(Boolean).join(' · '))}</div></div></div>
  <div class="row">${chipSt(pr)}${rotaChip(c)}${c.prazo?`<span class="chip">Prazo ${E(c.prazo)}</span>`:''}${ct?`<span class="chip warn">${I.clock.replace('<svg','<svg width="12" height="12"')}${E(ct)}</span>`:''}</div>
  ${pr&&pr.cesta.length?`<div class="pred" style="padding:12px"><div class="meta">Provável pedido · ${E(freq(pr))} · último ${T.ha(pr.desde)}</div><ul>${pr.cesta.map(i=>`<li><span class="mk">${E(T.item(i))}</span><span class="v">${T.brl(i.q*i.pu)}</span></li>`).join('')}</ul><div class="tot"><span class="mut">Valor provável</span><b>${T.brl(pr.valor)}</b></div></div>`:''}
  ${secRoteiro(c,pr)}
  ${ult?`<p class="mut" style="margin:0;font-size:13.5px">Último pedido ${T.quando(ult.dt,h)}: ${E(T.itens(ult.itens))} · ${T.brl(ult.total)}</p>`:''}
  <div class="row">${c.tel?`<a class="btn f2" id="fx-tel" href="tel:${E(c.tel)}" onclick="ui.canal='tel'">${I.phone}Ligar ${E(fmtTel(c.tel))}</a>`:'<span class="chip warn">Sem telefone</span>'}${pr&&pr.cesta.length?btnWA(c,msgLembrete(c,pr),'WhatsApp','f2" id="fx-wa'):''}<button class="btn p f2" id="fx-ped" onclick="ui.focoVolta=true;closeSheetKeep();lancarPrevisto('${c.id}')">${I.plus}Lançar pedido</button></div></div>
  <div class="res-grid">${[['pedido','1','ok'],['sem','2',''],['retorno','3','pen'],['nao','4','warn']].map(([k,n,cl])=>`<button class="res ${cl}" onclick="resultadoFoco('${c.id}','${k}')"><kbd>${n}</kbd>${RES[k]}</button>`).join('')}</div><div class="row" style="justify-content:flex-end;margin-top:10px"><button class="btn g" onclick="ui.fi++;drawSheet()">Pular ${I.go}</button></div>`;
  return[`Modo foco`,b,'']}
function closeSheetKeep(){ui.sheet=null;const el=$('sheet');el.hidden=true;el.innerHTML='';document.body.style.overflow=''}
function resultadoFoco(cid,res){if(res==='retorno')return openSheet('resultado',{cid,res:'retorno',foco:1});registrar(cid,res,'',true)}
function registrar(cid,res,ret,foco){const s=snap();const r=Core.contato(S,cid,{canal:ui.canal||'',res,ret},HOJE());ui.canal='';if(!r.ok)return toast(r.e,false);mudou();const c=Core.cli(S,cid);

const MCP={h:undefined,async get(){if(this.h!==undefined)return this.h;try{this.h=(window.claude&&window.claude.use)?await window.claude.use('mcp'):null}catch(e){this.h=null}return this.h}};
function gcalLink(t,d,hm,det){const s=(d+'T'+(hm||'09:00')).replace(/[-:]/g,'')+'00';const e2=new Date(U.dt(d));const [hh,mm]=(hm||'09:00').split(':').map(Number);e2.setHours(hh,mm+15);const e=U.iso(e2).replace(/-/g,'')+'T'+U.pad(e2.getHours())+U.pad(e2.getMinutes())+'00';return 'https://calendar.google.com/calendar/render?action=TEMPLATE&text='+encodeURIComponent(t)+'&dates='+s+'/'+e+'&details='+encodeURIComponent(det||'')}
function mcpErro(e,srv){const c=e&&e.code;return c==='server_not_connected'||c==='server_not_found'?srv+' não está conectado na sua conta Claude.':c==='needs_reauth'?'Entre de novo no '+srv+' (configurações de conectores do Claude).':c==='approval_required'||c==='not_granted'||c==='consent_required'?'Permissão para o '+srv+' não foi dada.':c==='blocked_by_policy'?srv+' bloqueado pela organização.':'Não consegui falar com o '+srv+'.'}
async function agendarGoogle(c,d,hm){const pr=predOf(c.id);const det='Cliente: '+c.nome+(c.tel?'\nTel: '+fmtTel(c.tel):'')+(pr&&pr.cesta.length?'\nProvável: '+T.itens(pr.cesta):'');const m=await MCP.get();
  if(m){try{const[hh,mm]=(hm||'09:00').split(':').map(Number);const fim=U.pad(hh)+':'+U.pad(mm+15);await m.callTool('Google Calendar','create_event',{summary:'Retornar: '+c.nome,startTime:d+'T'+(hm||'09:00')+':00',endTime:d+'T'+fim+':00',description:det});toast('Retorno criado na Google Agenda.');return}catch(e){toast(mcpErro(e,'Google Agenda'),false,[['Abrir agenda',()=>openSheet('link',{tit:'Criar na Google Agenda',url:gcalLink('Retornar: '+c.nome,d,hm,det),txt:'Abrir a Google Agenda com o lembrete preenchido'})]]);return}}

  const fab=$('fab');if(fab){fab.innerHTML=I.mic;fab.addEventListener('click',()=>{window.scrollTo({top:0,behavior:'smooth'});ouvir()})}

  // vira o dia sozinho: recalcula previsões se o app ficar aberto de um dia para o outro
  let dia=HOJE();setInterval(()=>{if(HOJE()!==dia){dia=HOJE();PR=null;if(AGRO()&&Core.autoEntregar(S,dia))mudou();if(!ui.sheet)draw()}},60000);
  if(window.claude&&window.claude.use){
    window.claude.use('sample').then(s=>{IA.s=s||null;if(ui.tab==='ajustes'&&!ui.sheet)draw()}).catch(()=>{});
    window.claude.use('downloads').then(d=>{IA.dl=d||null}).catch(()=>{});
    Store.conectar();
  }
}
