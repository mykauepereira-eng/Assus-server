<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style>
<title>Freguês Agro</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Pedidos de representante agro/pet/vet por voz, com rotas de entrega, carga do caminhão e previsão de reposição.">
<meta name="theme-color" content="#F2F4F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0D111C" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Freguês Agro">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Gabarito:wght@600;700;800&family=Instrument+Sans:wght@400;500;600;700&display=swap">
<style>
/* Caderneta de balcão: papel pautado e tinta de caneta azul. O que é previsão vem riscado com marca-texto amarelo.
   Layout: barra de captura fixa no topo (fale ou escreva), navegação embaixo no celular e na lateral no computador. */
:root{
  --paper:#F2F4F7;--sheet:#FFFFFF;--ink:#131A2B;--mut:#5A6479;--rule:#DCE1EA;--rule2:#EDF0F4;
  --pen:#2340C8;--pen-s:#E7ECFC;--on-pen:#FFFFFF;--bar:#C7D2F6;
  --marker:#FFE45E;--marker-s:#FFF7CC;--marker-ink:#4A3C00;
  --margin:#E39A94;
  --ok:#1C7A4B;--ok-s:#E1F2E8;--warn:#9A5800;--warn-s:#FCEFD8;--bad:#BE3227;--bad-s:#FBE5E2;
  --wa:#11804A;--wa-s:#E2F4EA;
  --av1:#DCE5FF;--av2:#FDE1CC;--av3:#D5EFDF;--av4:#F5D7EA;--av5:#E7E0FF;--av6:#FFF0B3;--av-ink:#1D2540;
  --scrim:rgba(13,18,32,.45);
  --shadow:0 1px 2px rgba(19,26,43,.06),0 10px 28px rgba(19,26,43,.08);
  --display:"Gabarito","Avenir Next","Segoe UI",system-ui,sans-serif;
  --body:"Instrument Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --hand:"Caveat","Segoe Print","Bradley Hand",cursive;
  --r:14px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#0D111C;--sheet:#151B2A;--ink:#E8ECF6;--mut:#9AA4BB;--rule:#283149;--rule2:#1D2436;
  --pen:#93AAFF;--pen-s:#1C2650;--on-pen:#0A1233;--bar:#2C3B78;
  --marker:#7A6614;--marker-s:#2D2912;--marker-ink:#FFF0A6;
  --margin:#8C4C48;
  --ok:#5ECB92;--ok-s:#12321F;--warn:#F1B65C;--warn-s:#3A2A10;--bad:#FF8C82;--bad-s:#3D1A18;
  --wa:#5ED39A;--wa-s:#123423;
  --av1:#25315C;--av2:#4A2F1F;--av3:#1F3D2D;--av4:#46243B;--av5:#30295A;--av6:#4A4315;--av-ink:#E8ECF6;
  --scrim:rgba(0,0,0,.6);--shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px rgba(0,0,0,.3);color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0D111C;--sheet:#151B2A;--ink:#E8ECF6;--mut:#9AA4BB;--rule:#283149;--rule2:#1D2436;
  --pen:#93AAFF;--pen-s:#1C2650;--on-pen:#0A1233;--bar:#2C3B78;
  --marker:#7A6614;--marker-s:#2D2912;--marker-ink:#FFF0A6;
  --margin:#8C4C48;
  --ok:#5ECB92;--ok-s:#12321F;--warn:#F1B65C;--warn-s:#3A2A10;--bad:#FF8C82;--bad-s:#3D1A18;
  --wa:#5ED39A;--wa-s:#123423;
  --av1:#25315C;--av2:#4A2F1F;--av3:#1F3D2D;--av4:#46243B;--av5:#30295A;--av6:#4A4315;--av-ink:#E8ECF6;
  --scrim:rgba(0,0,0,.6);--shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px rgba(0,0,0,.3);color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--paper)}
body{color:var(--ink);font:15px/1.5 var(--body);font-variant-numeric:tabular-nums;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--paper)}
h1,h2,h3{text-wrap:balance}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--pen);outline-offset:2px}
:where(svg[aria-hidden="true"]){width:18px;height:18px;flex:none;vertical-align:middle}
.av svg{width:20px;height:20px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.mut{color:var(--mut)}
a{color:var(--pen)}

/* estrutura */
.app{min-height:100vh}
nav{position:fixed;left:0;right:0;bottom:0;z-index:25;display:flex;background:var(--sheet);border-top:1px solid var(--rule);padding:6px max(6px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(6px,env(safe-area-inset-left,0px))}
nav .brand,nav .store{display:none}
nav button{flex:1;position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;border:0;background:none;color:var(--mut);font-size:12px;font-weight:600;padding:6px 2px;border-radius:12px;min-height:52px}
nav button svg{width:22px;height:22px}
nav button.on{color:var(--pen);background:var(--pen-s)}
nav .bd{position:absolute;top:3px;left:calc(50% + 6px);min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--pen);color:var(--on-pen);font-size:11px;line-height:18px}
.col{min-width:0}
.omni{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--paper);padding-block:12px 6px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.omni>*{max-width:1040px;margin-inline:auto}
main{display:block;max-width:1072px;margin:0 auto;padding-block:4px 120px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
main:focus{outline:0}
@media (min-width:900px){
  .app{display:grid;grid-template-columns:236px minmax(0,1fr)}
  nav{position:sticky;top:0;height:100vh;flex-direction:column;gap:4px;border-top:0;border-right:1px solid var(--rule);padding:22px 14px}
  nav .brand{display:block;font:800 30px/1 var(--display);letter-spacing:-.02em;color:var(--ink);padding:0 10px 18px}
  nav .brand small{display:block;font:600 13px/1.3 var(--body);letter-spacing:0;color:var(--mut);margin-top:6px}
  nav button{flex:none;flex-direction:row;gap:12px;font-size:15px;padding:10px 12px;min-height:44px;justify-content:flex-start}
  nav .bd{position:static;margin-left:auto}
  nav .store{display:flex;gap:8px;align-items:flex-start;margin-top:auto;font-size:12.5px;color:var(--mut);padding:10px}
  nav .store svg{width:16px;height:16px;flex:none;margin-top:2px}
  main{padding-bottom:64px}
  .omni{padding-top:18px}
}

/* captura: o caderno onde se fala ou escreve */
.cap{display:grid;grid-template-columns:56px minmax(0,1fr) auto;align-items:stretch;background:var(--sheet);border:1px solid var(--rule);border-radius:18px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.cap::before{content:"";position:absolute;left:56px;top:0;bottom:0;border-left:2px solid var(--margin);opacity:.75;pointer-events:none}
.cap textarea{display:block;border:0;outline:0;resize:none;background-color:transparent;font:500 16px/28px var(--body);padding:10px 12px 10px 16px;min-height:48px;max-height:196px;width:100%;
  background-image:linear-gradient(transparent 27px,var(--rule2) 27px);background-size:100% 28px;background-position:0 10px;background-attachment:local}
.cap textarea::placeholder{color:var(--mut);opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mic{align-self:center;justify-self:center;width:40px;height:40px;border-radius:50%;border:0;display:grid;place-items:center;background:var(--pen);color:var(--on-pen);position:relative}
.mic svg{width:20px;height:20px}
.mic.on{background:var(--bad);color:#fff}
.mic.on::after{content:"";position:absolute;inset:-5px;border-radius:50%;border:2px solid var(--bad);animation:pulse 1.2s ease-out infinite}
@keyframes pulse{from{opacity:.9;transform:scale(.9)}to{opacity:0;transform:scale(1.35)}}
.go{align-self:center;margin:0 8px 0 4px;display:inline-flex;align-items:center;gap:6px;border:1px solid var(--rule);background:var(--sheet);color:var(--pen);border-radius:12px;min-height:40px;padding:0 12px;font-weight:700}
.go svg{width:18px;height:18px}
.go span{display:none}
@media (min-width:600px){.go span{display:inline}}
.go:disabled{opacity:.6}
.hint{display:flex;gap:8px;align-items:center;min-height:22px;padding:6px 4px 0 6px;font-size:13px;color:var(--mut)}
.hint b{color:var(--ink);font-weight:600}
.hint .dot{width:7px;height:7px;border-radius:50%;background:var(--ok);flex:none}
.hint .dot.busy{background:var(--marker);animation:pulse 1s infinite alternate}
.hint .dot.rec{background:var(--bad)}

/* faixas e cabeçalhos */
#banner{max-width:1072px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.banner{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;background:var(--marker-s);color:var(--ink);border:1px dashed var(--marker);border-radius:12px;padding:10px 12px;margin:8px 0 2px;font-size:14px}
.banner .btn{margin-left:auto}
.hd{display:flex;flex-wrap:wrap;align-items:flex-end;gap:4px 16px;margin:14px 0 4px}
.hd h1{font:800 clamp(26px,5vw,34px)/1.05 var(--display);letter-spacing:-.02em;margin:0}
.hd h1 em{font-style:normal;color:var(--pen)}
.hd p{margin:0;color:var(--mut)}
.back{display:inline-flex;align-items:center;gap:4px;border:0;background:none;color:var(--mut);font-weight:600;padding:6px 0;margin-top:8px}
.back svg{width:18px;height:18px}
.strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:14px 0 4px}
.stat{background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r);padding:12px 14px;display:grid;gap:2px;text-align:left;color:var(--ink)}
button.stat:hover{border-color:var(--pen)}
.stat b{font:800 24px/1.1 var(--display);letter-spacing:-.01em}
.stat span{font-size:13px;color:var(--mut)}
.stat .d{font-size:12px;font-weight:600}
.stat .d.up{color:var(--ok)}.stat .d.dn{color:var(--bad)}

.sec{margin-top:26px}
.sh{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;margin:0 0 8px;min-height:30px}
.sh h2{min-width:0;overflow-wrap:anywhere}
.sh h2{font:700 12.5px/1.2 var(--body);letter-spacing:.09em;text-transform:uppercase;color:var(--mut);margin:0}
.sh .n{font:700 12px/1 var(--body);background:var(--rule2);color:var(--mut);border-radius:999px;padding:4px 8px}
.sh .r{margin-left:auto;display:flex;gap:6px}
.list{background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r);overflow:hidden}
.it{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:4px 12px;align-items:start;padding:12px 14px;border-top:1px solid var(--rule2)}
.it:first-child{border-top:0}
.it .bd{min-width:0;display:grid;gap:3px}
.it .nm{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;font-weight:650}
.it .sub{font-size:13.5px;color:var(--mut);overflow-wrap:anywhere}
.it .val{font:700 15px/1.3 var(--body);text-align:right;white-space:nowrap;padding-top:2px}
.it .val small{display:block;font-weight:500;font-size:12px;color:var(--mut)}
.it .acts{grid-column:2/-1;display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.it.click{cursor:pointer}
.it.click:hover{background:var(--rule2)}
.lnk{border:0;background:none;padding:0;font:inherit;font-weight:650;color:var(--ink);text-align:left;cursor:pointer}
.lnk:hover{color:var(--pen);text-decoration:underline}
.empty{background:var(--sheet);border:1px dashed var(--rule);border-radius:var(--r);padding:16px;color:var(--mut);font-size:14px}
.empty b{color:var(--ink)}

/* avatar, chips, marca-texto, letra de mão */
.av{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font:700 14px/1 var(--display);color:var(--av-ink);flex:none}
.av.big{width:58px;height:58px;font-size:20px}
.chip{display:inline-flex;align-items:center;gap:4px;font:650 11.5px/1 var(--body);padding:4px 8px;border-radius:999px;background:var(--rule2);color:var(--mut);white-space:nowrap;letter-spacing:.01em}
.chip.pen{background:var(--pen-s);color:var(--pen)}
.chip.ok{background:var(--ok-s);color:var(--ok)}
.chip.warn{background:var(--warn-s);color:var(--warn)}
.chip.bad{background:var(--bad-s);color:var(--bad)}
.chip.mk{background:var(--marker-s);color:var(--marker-ink)}
.mk{background:linear-gradient(100deg,transparent 0 1.5%,var(--marker) 1.5% 98%,transparent 98%) 0 70%/100% 58% no-repeat;padding:0 3px;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.ces{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:14px;color:var(--ink)}
.hand{font-family:var(--hand);font-weight:700;font-size:21px;line-height:1;color:var(--pen)}
.cf{display:inline-flex;gap:2px;align-items:flex-end;vertical-align:middle}
.cf i{width:4px;border-radius:1px;background:var(--rule)}
.cf i:nth-child(1){height:6px}.cf i:nth-child(2){height:8px}.cf i:nth-child(3){height:10px}.cf i:nth-child(4){height:12px}.cf i:nth-child(5){height:14px}
.cf i.on{background:var(--pen)}
.tr{font-size:12px;font-weight:700}.tr.up{color:var(--ok)}.tr.dn{color:var(--bad)}

/* botões */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:36px;padding:6px 12px;border-radius:10px;border:1px solid var(--rule);background:var(--sheet);color:var(--ink);font:650 14px/1.1 var(--body);text-decoration:none;white-space:nowrap}
.btn:hover{border-color:var(--pen);color:var(--pen)}
.btn svg{width:16px;height:16px;flex:none}
.btn.p{background:var(--pen);border-color:var(--pen);color:var(--on-pen)}
.btn.p:hover{filter:brightness(1.07);color:var(--on-pen)}
.btn.wa{color:var(--wa);background:var(--wa-s);border-color:transparent}
.btn.wa:hover{border-color:var(--wa)}
.btn.g{border-color:transparent;background:transparent;color:var(--mut)}
.btn.g:hover{color:var(--pen);background:var(--pen-s)}
.btn.d{color:var(--bad)}
.btn.d.arm{background:var(--bad);border-color:var(--bad);color:#fff}
.btn.sm{min-height:32px;padding:4px 10px;font-size:13px;border-radius:9px}
.btn.f{width:100%;min-height:46px;font-size:15px}
.btn:disabled{opacity:.55;cursor:default}
.seg{display:inline-flex;flex-wrap:wrap;gap:4px;background:var(--rule2);padding:4px;border-radius:12px}
.seg button{border:0;background:none;border-radius:9px;padding:6px 11px;font-weight:650;font-size:13.5px;color:var(--mut);min-height:32px}
.seg button.on{background:var(--sheet);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}

/* cartão de previsão (cliente) */
.pred{background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r);padding:16px;display:grid;gap:12px}
.pred .top{display:flex;flex-wrap:wrap;gap:6px 18px;align-items:flex-end}
.pred .top .hand{font-size:34px}
.pred .meta{font-size:13.5px;color:var(--mut)}
.pred ul{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.pred li{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.pred li .v{margin-left:auto;color:var(--mut);font-size:13.5px}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.cli-h{display:flex;gap:14px;align-items:center;margin:6px 0 4px}
.cli-h h1{font:800 clamp(24px,5vw,32px)/1.05 var(--display);letter-spacing:-.02em;margin:0}
.cli-h .apel{color:var(--mut);font-size:13.5px;margin-top:4px}
.contato{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:14px;color:var(--mut);margin:8px 0 2px}
.contato span{display:inline-flex;gap:6px;align-items:center}
.contato svg{width:15px;height:15px}
.notas{display:grid;gap:8px}
.nota{background:var(--marker-s);border-radius:10px;padding:10px 12px;font-size:14px;display:flex;gap:10px;align-items:flex-start}
.nota small{display:block;color:var(--mut);font-size:12px}
.nota .btn{margin-left:auto}

/* radar */
.grid2{display:grid;gap:18px;grid-template-columns:minmax(0,1fr)}
@media (min-width:900px){.grid2{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}}
.chart{background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r);padding:12px 8px 6px}
.chart svg{display:block;width:100%;height:auto}
.chart text{font:600 12px var(--body);fill:var(--mut)}
.chart .vl{fill:var(--ink);font-weight:700}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;color:var(--mut);padding:4px 8px 6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.tbl-w{overflow-x:auto;background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r)}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:9px 12px;border-top:1px solid var(--rule2);white-space:nowrap}
th{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--mut);border-top:0;font-weight:700}
td.n,th.n{text-align:right}
.bar{height:6px;border-radius:3px;background:var(--rule2);overflow:hidden;min-width:60px}
.bar i{display:block;height:100%;background:var(--pen)}
.day{display:grid;grid-template-columns:86px minmax(0,1fr);gap:10px;padding:10px 14px;border-top:1px solid var(--rule2);align-items:start}
.day:first-child{border-top:0}
.day .dl{font-weight:700;font-size:13.5px}
.day .dl small{display:block;color:var(--mut);font-weight:500}
.day .cs{display:flex;flex-wrap:wrap;gap:6px}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:8px;padding:4px 8px;font-size:13px;border:1px solid var(--rule);background:var(--sheet);color:var(--ink);cursor:pointer}
.pill.prov{border:1px dashed var(--marker);background:var(--marker-s)}
.pill small{color:var(--mut)}

/* formulários */
.fg{display:grid;gap:12px}
.fl{display:grid;gap:4px;min-width:0}
.fl>span{font-size:12.5px;font-weight:650;color:var(--mut)}
.fr{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(130px,1fr))}
input,select,textarea{width:100%;background:var(--sheet);border:1px solid var(--rule);border-radius:10px;padding:8px 10px;min-height:42px;color:var(--ink)}
textarea{min-height:80px;resize:vertical;line-height:1.45}
input:focus,select:focus,textarea:focus{outline:2px solid var(--pen);outline-offset:0;border-color:var(--pen)}
.ck{display:flex;gap:10px;align-items:flex-start;font-size:14.5px;padding:6px 0}
.ck input{width:20px;height:20px;min-height:0;margin-top:1px;accent-color:var(--pen);flex:none}
.ck small{display:block;color:var(--mut);font-size:13px}
.its{display:grid;gap:8px}
.irow{display:grid;grid-template-columns:72px 88px minmax(0,1fr) 92px 34px;gap:6px;align-items:center}
.irow .x{border:0;background:none;color:var(--mut);width:34px;height:34px;display:grid;place-items:center;border-radius:8px}
.irow .x:hover{color:var(--bad);background:var(--bad-s)}
.irow .x svg{width:16px;height:16px}
@media (max-width:560px){.irow.ih{display:none}.irow{grid-template-columns:64px 80px minmax(0,1fr) 34px}.irow .pn{grid-column:1/4;grid-row:1}.irow .x{grid-column:4;grid-row:1}.irow .pu{grid-column:3;grid-row:2}}
.ih{font-size:12px;color:var(--mut);font-weight:650}
.tot{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:15px;padding-top:4px}
.tot b{font:800 22px/1 var(--display)}
.avisos{display:grid;gap:4px;font-size:13px;color:var(--warn);margin:0;padding:0;list-style:none}
.disse{font-size:13px;color:var(--mut);border-left:3px solid var(--margin);padding:2px 0 2px 10px}
.disse q{font-style:italic;color:var(--ink)}
.dcard{border:1px solid var(--rule);border-radius:var(--r);padding:14px;display:grid;gap:12px}
.dcard+.dcard{margin-top:12px}
.dhead{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.dhead .seg{font-size:13px}

/* janela inferior (sheet) */
#sheet{position:fixed;inset:0;z-index:60;display:grid;align-items:end;justify-items:center}
#sheet .scrim{position:absolute;inset:0;background:var(--scrim)}
.sp{position:relative;background:var(--sheet);width:100%;max-width:680px;max-height:92vh;overflow:auto;overscroll-behavior:contain;border-radius:22px 22px 0 0;padding:0 max(16px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));box-shadow:var(--shadow);animation:up .2s ease}
@keyframes up{from{transform:translateY(16px);opacity:.6}}
.sp-h{position:sticky;top:0;z-index:2;background:var(--sheet);display:flex;align-items:center;gap:10px;padding:16px 0 10px;border-bottom:1px solid var(--rule2);margin-bottom:14px}
.sp-h h2{font:800 21px/1.15 var(--display);margin:0;letter-spacing:-.01em}
.sp-h .btn{margin-left:auto}
.sp-f{position:sticky;bottom:calc(-18px - env(safe-area-inset-bottom,0px));background:var(--sheet);padding:12px 0 calc(6px + env(safe-area-inset-bottom,0px));margin-top:14px;border-top:1px solid var(--rule2);display:flex;flex-wrap:wrap;gap:8px}
.sp-f .btn.p{flex:1}
@media (min-width:700px){#sheet{align-items:center}.sp{border-radius:22px;max-height:88vh}.sp-f{bottom:-18px}}
.resp{white-space:pre-wrap;font-size:15.5px;line-height:1.55}
.resp p{margin:0 0 8px;white-space:normal}
.msg{border:1px solid var(--rule);border-radius:12px;padding:12px;display:grid;gap:8px}
.msg+.msg{margin-top:10px}
.msg .tx{font-size:14px;background:var(--rule2);border-radius:10px;padding:10px;white-space:pre-wrap}
.msg.ok{opacity:.55}

/* avisos rápidos */
#toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(80px + env(safe-area-inset-bottom,0px));z-index:70;display:grid;gap:8px;width:min(560px,calc(100vw - 32px))}
@media (min-width:900px){#toasts{bottom:24px;left:calc(50% + 118px)}}
.toast{display:flex;align-items:center;gap:10px;background:var(--ink);color:var(--paper);border-radius:12px;padding:10px 12px;font-size:14px;box-shadow:var(--shadow);animation:up .2s ease}
.toast.bad{background:var(--bad);color:#fff}
.toast span{flex:1}
.toast button{border:0;background:transparent;color:inherit;font-weight:700;text-decoration:underline;padding:4px 6px;white-space:nowrap}
.tst{display:grid;gap:4px;font-size:13.5px;margin-top:10px}
.tst .f{color:var(--bad)}
kbd{font:600 12px var(--body);border:1px solid var(--rule);border-bottom-width:2px;border-radius:6px;padding:1px 6px;background:var(--sheet)}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
/* ===== Camada de vidro =====
   Psicologia das cores aplicada: azul-caneta = confiança e foco (ação principal); violeta no fim do degradê = automação e IA;
   amarelo marca-texto = oportunidade prevista; verde = dinheiro entrando e meta; âmbar = atenção sem alarme; vermelho = risco de perder o cliente.
   O fundo é um degradê suave dessas cores; os painéis são vidro fosco por cima, para a informação "flutuar" sobre o caderno. */
:root{
  --mesh1:rgba(35,64,200,.16);--mesh2:rgba(255,214,64,.22);--mesh3:rgba(28,160,110,.13);--mesh4:rgba(120,80,230,.12);
  --glass:rgba(255,255,255,.62);--glass2:rgba(255,255,255,.78);--glass-b:rgba(255,255,255,.75);--glass-e:rgba(19,26,43,.08);--glass-hi:rgba(255,255,255,.9);
  --g-pen:linear-gradient(135deg,#2340C8 0%,#3C55E0 45%,#6B4DE6 100%);--g-ok:linear-gradient(90deg,#1C7A4B,#2FB27A);--g-mk:linear-gradient(100deg,#FFE45E,#FFD23F);--g-warn:linear-gradient(135deg,#F5A524,#E86F1C);
  --glow:0 8px 24px rgba(35,64,200,.28);--blur:saturate(1.5) blur(18px);
  --spring:cubic-bezier(.2,.9,.25,1.12);--ease:cubic-bezier(.2,.7,.2,1);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --mesh1:rgba(120,145,255,.18);--mesh2:rgba(255,206,70,.09);--mesh3:rgba(60,200,140,.10);--mesh4:rgba(150,110,255,.16);
  --glass:rgba(22,28,46,.58);--glass2:rgba(26,33,54,.82);--glass-b:rgba(255,255,255,.09);--glass-e:rgba(0,0,0,.35);--glass-hi:rgba(255,255,255,.07);
  --g-pen:linear-gradient(135deg,#7E97FF 0%,#93AAFF 40%,#B79BFF 100%);--g-ok:linear-gradient(90deg,#3DB57E,#6FE0A8);--g-mk:linear-gradient(100deg,#8A7414,#A08A1E);--glow:0 8px 28px rgba(147,170,255,.25)}}
:root[data-theme="dark"]{
  --mesh1:rgba(120,145,255,.18);--mesh2:rgba(255,206,70,.09);--mesh3:rgba(60,200,140,.10);--mesh4:rgba(150,110,255,.16);
  --glass:rgba(22,28,46,.58);--glass2:rgba(26,33,54,.82);--glass-b:rgba(255,255,255,.09);--glass-e:rgba(0,0,0,.35);--glass-hi:rgba(255,255,255,.07);
  --g-pen:linear-gradient(135deg,#7E97FF 0%,#93AAFF 40%,#B79BFF 100%);--g-ok:linear-gradient(90deg,#3DB57E,#6FE0A8);--g-mk:linear-gradient(100deg,#8A7414,#A08A1E);--glow:0 8px 28px rgba(147,170,255,.25)}

/* fundo em degradê vivo */
.app::before{content:"";position:fixed;inset:-20%;z-index:-1;pointer-events:none;
  background:radial-gradient(38% 32% at 12% 8%,var(--mesh1),transparent 70%),radial-gradient(30% 28% at 88% 14%,var(--mesh2),transparent 70%),radial-gradient(34% 30% at 78% 82%,var(--mesh3),transparent 70%),radial-gradient(30% 30% at 20% 88%,var(--mesh4),transparent 70%);
  animation:deriva 28s ease-in-out infinite alternate}
@keyframes deriva{to{transform:translate3d(2%,-2%,0) scale(1.06) rotate(2deg)}}
.app{isolation:isolate;position:relative}

/* superfícies de vidro */
.list,.stat,.pred,.chart,.tbl-w,.empty,.dcard,.msg,.integ,.foco-card,.cap,nav,.omni .cap{background:var(--glass);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);border:1px solid var(--glass-b);box-shadow:0 1px 0 var(--glass-hi) inset,0 10px 30px -12px var(--glass-e)}
.omni{background:transparent}
.omni::before{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(var(--paper),color-mix(in srgb,var(--paper) 70%,transparent) 70%,transparent);pointer-events:none}
nav{border-width:0 0 0 0;border-top:1px solid var(--glass-b)}
@media (min-width:900px){nav{border-top:0;border-right:1px solid var(--glass-b)}}
nav .brand{background:var(--g-pen);-webkit-background-clip:text;background-clip:text;color:transparent}
nav .brand small{-webkit-text-fill-color:var(--mut)}
nav .brand span{color:inherit!important}
nav button{transition:background .25s var(--ease),color .25s var(--ease),transform .15s var(--ease)}
nav button.on{background:var(--g-pen);color:var(--on-pen);box-shadow:var(--glow)}
nav button:active{transform:scale(.95)}
.sp{background:var(--glass2);-webkit-backdrop-filter:saturate(1.6) blur(24px);backdrop-filter:saturate(1.6) blur(24px);border:1px solid var(--glass-b)}
.sp-h,.sp-f{background:transparent}
.sp-h{backdrop-filter:blur(10px)}
#sheet .scrim{-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
.it{border-top-color:var(--glass-b)}
.it:hover{background:var(--glass-hi)}
.it.done{opacity:.6}

/* captura: borda viva em degradê quando ativa */
.cap{transition:box-shadow .3s var(--ease),transform .3s var(--ease)}
.cap:focus-within{box-shadow:0 0 0 2px transparent,0 12px 34px -10px rgba(35,64,200,.35);border-color:transparent;background:linear-gradient(var(--glass2),var(--glass2)) padding-box,var(--g-pen) border-box;transform:translateY(-1px)}
.mic{background:var(--g-pen);box-shadow:var(--glow);transition:transform .2s var(--spring)}
.mic:hover{transform:scale(1.06)}.mic:active{transform:scale(.92)}
.mic.on{background:linear-gradient(135deg,#E5484D,#F07A3E)}
.mic.on::after{border:0;inset:-6px;background:conic-gradient(from 0deg,#E5484D,#F5A524,#6B4DE6,#E5484D);-webkit-mask:radial-gradient(circle,transparent 58%,#000 60%);mask:radial-gradient(circle,transparent 58%,#000 60%);animation:gira 1.2s linear infinite}
@keyframes gira{to{transform:rotate(1turn)}}
.go{transition:all .2s var(--ease)}
.go:hover{background:var(--g-pen);color:var(--on-pen);border-color:transparent;box-shadow:var(--glow)}

/* botões: degradê, brilho e resposta ao toque */
.btn{transition:transform .16s var(--spring),box-shadow .2s var(--ease),background .2s var(--ease),color .2s,border-color .2s;background:var(--glass2)}
.btn:hover{transform:translateY(-1px);box-shadow:0 6px 16px -8px var(--glass-e)}
.btn:active{transform:translateY(0) scale(.96)}
.btn.p{background:var(--g-pen);border-color:transparent;box-shadow:var(--glow)}
.btn.p:hover{filter:brightness(1.08) saturate(1.1)}
.btn.glow{position:relative;overflow:hidden}
.btn.glow::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.45) 50%,transparent 70%);transform:translateX(-100%);animation:brilho 2.8s ease-in-out infinite}
@keyframes brilho{60%,100%{transform:translateX(100%)}}
.btn.wa{background:var(--wa-s)}
.btn.g{background:transparent}
.seg{background:var(--glass);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);border:1px solid var(--glass-b)}
.seg button{transition:all .25s var(--ease)}
.seg button.on{background:var(--g-pen);color:var(--on-pen);box-shadow:var(--glow)}
.seg button.on small{color:inherit;opacity:.8}

/* números, barras e destaques */
.stat{transition:transform .25s var(--spring),box-shadow .25s}
button.stat:hover{transform:translateY(-2px);box-shadow:0 14px 30px -14px rgba(35,64,200,.4)}
.stat b{background:linear-gradient(180deg,var(--ink),color-mix(in srgb,var(--ink) 70%,var(--pen)));-webkit-background-clip:text;background-clip:text;color:transparent}
.stat b span{-webkit-text-fill-color:var(--mut)}
.bar{background:var(--glass-b);height:7px}
.bar i{background:var(--g-ok);border-radius:4px;transform-origin:left;animation:cresce .9s var(--ease) both}
@keyframes cresce{from{transform:scaleX(0)}}
.chip{transition:transform .2s var(--spring)}
.chip.pen{background:linear-gradient(135deg,var(--pen-s),color-mix(in srgb,var(--pen-s) 60%,#E9E2FF))}
.chip.ok{background:linear-gradient(135deg,var(--ok-s),color-mix(in srgb,var(--ok-s) 70%,#DFF7EC))}
.hd h1 em{background:var(--g-pen);-webkit-background-clip:text;background-clip:text;color:transparent}
.banner{background:linear-gradient(120deg,var(--marker-s),color-mix(in srgb,var(--marker-s) 70%,transparent));-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur)}
.av{box-shadow:0 0 0 2px var(--glass-hi),0 4px 10px -4px var(--glass-e);transition:transform .25s var(--spring)}
.it:hover .av{transform:scale(1.07) rotate(-3deg)}
.toast{background:var(--glass2);color:var(--ink);-webkit-backdrop-filter:saturate(1.6) blur(18px);backdrop-filter:saturate(1.6) blur(18px);border:1px solid var(--glass-b);box-shadow:0 18px 40px -16px rgba(0,0,0,.35);animation:toastIn .45s var(--spring)}
.toast::before{content:"";width:4px;align-self:stretch;border-radius:4px;background:var(--g-ok)}
.toast.bad::before{background:var(--g-warn)}
.toast.bad{background:var(--glass2);color:var(--ink)}
.toast button{color:var(--pen)}
.toast.out{animation:toastOut .25s var(--ease) forwards}
@keyframes toastIn{from{opacity:0;transform:translateY(16px) scale(.96)}}
@keyframes toastOut{to{opacity:0;transform:translateY(8px) scale(.97)}}

/* janela: entra com mola, sai suave */
.sp{animation:sobe .42s var(--spring)}
#sheet .scrim{animation:fade .25s ease}
#sheet.out .sp{animation:desce .2s var(--ease) forwards}
#sheet.out .scrim{animation:fade .2s ease reverse forwards}
@keyframes sobe{from{transform:translateY(40px) scale(.98);opacity:0}}
@keyframes desce{to{transform:translateY(30px);opacity:0}}
@keyframes fade{from{opacity:0}}

/* entrada das telas: blocos e linhas em cascata (só ao navegar) */
main.anim .hd,main.anim .strip>*,main.anim .sec,main.anim .banner{animation:rise .5s var(--ease) both}
main.anim .strip>*:nth-child(2){animation-delay:.05s}main.anim .strip>*:nth-child(3){animation-delay:.1s}main.anim .strip>*:nth-child(4){animation-delay:.15s}
main.anim .sec:nth-of-type(2){animation-delay:.08s}main.anim .sec:nth-of-type(3){animation-delay:.14s}main.anim .sec:nth-of-type(4){animation-delay:.2s}main.anim .sec:nth-of-type(n+5){animation-delay:.26s}
main.anim .list>.it{animation:rise .45s var(--ease) both}
main.anim .list>.it:nth-child(2){animation-delay:.04s}main.anim .list>.it:nth-child(3){animation-delay:.08s}main.anim .list>.it:nth-child(4){animation-delay:.12s}main.anim .list>.it:nth-child(5){animation-delay:.16s}main.anim .list>.it:nth-child(n+6){animation-delay:.2s}
@keyframes rise{from{opacity:0;transform:translateY(10px)}}
.gbar{transform-box:fill-box;transform-origin:bottom;animation:cresceY .7s var(--ease) both;animation-delay:calc(var(--i,0)*35ms)}
.chart rect{transform-box:fill-box;transform-origin:bottom;animation:cresceY .8s var(--ease) both}
@keyframes cresceY{from{transform:scaleY(0)}}
::view-transition-old(root){animation:.18s var(--ease) both vtOut}
::view-transition-new(root){animation:.32s var(--ease) both vtIn}
@keyframes vtOut{to{opacity:0;transform:translateY(-4px)}}
@keyframes vtIn{from{opacity:0;transform:translateY(8px)}}

/* modo foco */
.foco-prog{height:6px;border-radius:4px;background:var(--glass-b);overflow:hidden}
.foco-prog i{display:block;height:100%;background:var(--g-pen);transition:width .5s var(--ease)}
.foco-card{border-radius:18px;padding:16px;display:grid;gap:12px;animation:rise .4s var(--spring)}
.btn.f2{flex:1;min-height:46px;font-size:15px}
.res-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:12px}
@media (min-width:640px){.res-grid{grid-template-columns:repeat(4,minmax(0,1fr))}}
.res{display:flex;align-items:center;justify-content:center;gap:8px;min-height:52px;border-radius:14px;border:1px solid var(--glass-b);background:var(--glass2);font-weight:700;color:var(--ink);transition:transform .16s var(--spring),box-shadow .2s}
.res:hover{transform:translateY(-2px);box-shadow:0 10px 22px -12px var(--glass-e)}
.res:active{transform:scale(.95)}
.res.ok{background:var(--g-ok);color:#fff;border-color:transparent}
.res.pen{background:var(--g-pen);color:var(--on-pen);border-color:transparent}
.res.warn{background:var(--warn-s);color:var(--warn)}
.res kbd{background:rgba(255,255,255,.25);border-color:rgba(255,255,255,.35);color:inherit}
.done-card{text-align:center;padding:20px 0}
.done-card .big{width:72px;height:72px;margin:0 auto 10px;border-radius:50%;display:grid;place-items:center;background:var(--g-ok);color:#fff;animation:pop .6s var(--spring)}
.done-card .big svg{width:36px;height:36px}
@keyframes pop{0%{transform:scale(.3);opacity:0}70%{transform:scale(1.1)}}

/* integrações */
.integ-grid{display:grid;gap:12px;grid-template-columns:minmax(0,1fr)}
@media (min-width:760px){.integ-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
.integ{border-radius:16px;padding:14px;display:grid;gap:10px;align-content:start;transition:transform .25s var(--spring)}
.integ:hover{transform:translateY(-2px)}
.ih2{display:flex;align-items:center;gap:10px}
.ih2 .chip{margin-left:auto}
.iic{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:var(--g-pen);color:var(--on-pen);box-shadow:var(--glow)}
.iic svg{width:18px;height:18px}
.ib{font-size:13.5px;color:var(--mut);display:grid;gap:8px}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){.list,.stat,.pred,.chart,.tbl-w,.empty,.dcard,.msg,.integ,.foco-card,.cap,nav,.sp{background:var(--sheet)}}

@media (max-width:700px){.kbdh,.res kbd{display:none}}

/* vendedor interno: cortes, chamada para o foco, roteiro da ligação */
.cortes{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(210px,1fr))}
.corte{display:grid;gap:2px;text-align:left;padding:12px 14px;border-radius:16px;border:1px solid var(--glass-b);background:var(--glass);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);color:var(--ink);box-shadow:0 1px 0 var(--glass-hi) inset,0 10px 30px -14px var(--glass-e);transition:transform .25s var(--spring),box-shadow .25s}
.corte:hover{transform:translateY(-2px);box-shadow:0 16px 30px -16px rgba(35,64,200,.45)}
.corte .cn{font:800 16px/1.2 var(--display)}
.corte .cd{font-size:13px;color:var(--mut)}
.corte .cc{font-size:13px;font-weight:700;color:var(--pen)}
.corte .cp{font-size:12.5px;color:var(--mut)}
.corte.urg{background:linear-gradient(135deg,var(--warn-s),var(--glass));border-color:color-mix(in srgb,var(--warn) 40%,transparent)}
.corte.urg .cc{color:var(--warn);animation:pisca 1.6s ease-in-out infinite}
.corte.fim{opacity:.6}.corte.fim .cc{color:var(--mut)}
@keyframes pisca{50%{opacity:.55}}
.stat.cta{background:var(--g-pen);color:var(--on-pen);border-color:transparent;box-shadow:var(--glow);position:relative;overflow:hidden;cursor:pointer}
.stat.cta b,.stat.cta b span{background:none;-webkit-text-fill-color:currentColor;color:var(--on-pen)}
.stat.cta span{color:var(--on-pen);opacity:.9}
.stat.cta svg{position:absolute;right:14px;top:50%;width:26px;height:26px;transform:translateY(-50%);opacity:.9}
.stat.cta::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.35) 50%,transparent 70%);transform:translateX(-100%);animation:brilho 3.2s ease-in-out infinite}
.stat.cta:disabled{background:var(--glass);color:var(--ink);box-shadow:none;cursor:default}
.stat.cta:disabled b,.stat.cta:disabled span{color:var(--mut)}
.stat.cta:disabled::after{display:none}
.roteiro{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.roteiro li{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:10px 12px;border-radius:12px;background:var(--glass);border:1px solid var(--glass-b);font-size:14px}
.roteiro li>svg{width:18px;height:18px;color:var(--pen);flex:none}
.roteiro li>span{flex:1;min-width:180px}
.roteiro li .btn{margin-left:auto}
.res.on{outline:2px solid var(--pen);outline-offset:2px}
.res.sel{background:var(--glass);border-color:var(--pen)}

@media (max-width:700px){.cortes{grid-auto-flow:column;grid-auto-columns:minmax(190px,72%);grid-template-columns:none;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:6px}.corte{scroll-snap-align:start}}

/* acesso rápido */
.quick{display:flex;gap:8px;overflow-x:auto;padding:8px 2px 4px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.quick::-webkit-scrollbar{display:none}
.qk{flex:none;display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:6px 12px;border-radius:999px;border:1px solid var(--glass-b);background:var(--glass);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);color:var(--ink);font:650 13.5px/1 var(--body);white-space:nowrap;transition:transform .16s var(--spring),box-shadow .2s,background .2s}
.qk svg{width:16px;height:16px}
.qk:hover{transform:translateY(-1px);box-shadow:0 8px 18px -10px var(--glass-e)}
.qk:active{transform:scale(.95)}
.qk.p{background:var(--g-pen);color:var(--on-pen);border-color:transparent;box-shadow:var(--glow)}
.qk.p b{background:rgba(255,255,255,.25);border-radius:999px;padding:2px 7px;font-size:12px}
.qk.p:disabled{background:var(--glass);color:var(--mut);box-shadow:none}
.qk.warn{background:var(--warn-s);color:var(--warn);border-color:color-mix(in srgb,var(--warn) 35%,transparent)}
.qk.g{color:var(--mut)}
.qk kbd{font-size:11px;padding:0 5px}
@media (max-width:700px){.qk kbd{display:none}}
.pal{display:grid;gap:10px}
.pal input{font-size:17px;min-height:48px;border-radius:14px}
.pal-l{display:grid;gap:4px;max-height:min(58vh,520px);overflow:auto;padding:2px}
.pal-i,.pal-c{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:10px 12px;border-radius:12px;border:1px solid transparent;background:transparent;color:var(--ink);cursor:pointer;transition:background .15s,border-color .15s}
.pal-i svg{width:18px;height:18px;color:var(--pen);flex:none}
.pal-i span{flex:1;font-weight:600}
.pal-i:hover,.pal-c:hover,.pal-i.on,.pal-c.on{background:var(--glass);border-color:var(--glass-b)}
.pal-i.on,.pal-c.on{box-shadow:inset 3px 0 0 var(--pen)}
.pal-c .bd{flex:1;min-width:0;display:grid;gap:2px}
.pal-c .nm{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-weight:650}
.pal-c .sub{font-size:13px;color:var(--mut)}
.pal-a{display:flex;gap:6px;flex:none}
.pal-a .btn.sm{min-height:34px;padding:4px 9px}
@media (max-width:560px){.pal-c{flex-wrap:wrap}.pal-a{width:100%;padding-left:50px}.pal-a .btn.p{flex:1}}
.pal-dica{font-size:12.5px;margin:0}
@media (max-width:700px){.pal-dica{display:none}}
.fab{display:none}
@media (max-width:899px){.fab{display:grid;place-items:center;position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:24;width:60px;height:60px;border-radius:50%;border:0;background:var(--g-pen);color:var(--on-pen);box-shadow:var(--glow),0 10px 26px -8px rgba(0,0,0,.35);transition:transform .2s var(--spring)}
  .fab svg{width:26px;height:26px}.fab:active{transform:scale(.9)}
  .fab.on{background:linear-gradient(135deg,#E5484D,#F07A3E)}
  .fab.on::after{content:"";position:absolute;inset:-6px;border-radius:50%;background:conic-gradient(from 0deg,#E5484D,#F5A524,#6B4DE6,#E5484D);-webkit-mask:radial-gradient(circle,transparent 60%,#000 62%);mask:radial-gradient(circle,transparent 60%,#000 62%);animation:gira 1.2s linear infinite}
  body:has(#sheet:not([hidden])) .fab{opacity:0;pointer-events:none}}

/* ============ Freguês · núcleo (sem DOM): datas, texto, intérprete de frases, previsão e operações ============ */
const U={
  pad:n=>String(n).padStart(2,'0'),
  iso(d){return d.getFullYear()+'-'+U.pad(d.getMonth()+1)+'-'+U.pad(d.getDate())},
  dt(s){const[y,m,d]=String(s).split('-').map(Number);return new Date(y,(m||1)-1,d||1,12)},
  add(s,n){const d=U.dt(s);d.setDate(d.getDate()+Math.round(n));return U.iso(d)},
  diff(a,b){return Math.round((U.dt(a)-U.dt(b))/864e5)},
  dow(s){return U.dt(s).getDay()},
  hoje(){return U.iso(new Date())},
  isISO(s){return /^\d{4}-\d{2}-\d{2}$/.test(s||'')&&!isNaN(U.dt(s))&&U.iso(U.dt(s))===s},
  // mesmo tamanho do texto original (NFC): permite mapear trechos achados de volta ao que foi dito
  norm(s){return String(s==null?'':s).normalize('NFC').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'')},
  key(s){return U.norm(s).replace(/[^a-z0-9]+/g,' ').trim()},
  r2:n=>Math.round((+n||0)*100)/100,
  uid:()=>Date.now().toString(36).slice(-6)+Math.random().toString(36).slice(2,6),
  median(a){if(!a.length)return 0;const s=[...a].sort((x,y)=>x-y),m=s.length>>1;return s.length%2?s[m]:(s[m-1]+s[m])/2},
  mean(a){return a.length?a.reduce((x,y)=>x+y,0)/a.length:0},
  std(a){if(a.length<2)return 0;const m=U.mean(a);return Math.sqrt(a.reduce((s,x)=>s+(x-m)**2,0)/(a.length-1))},
  clamp:(x,a,b)=>Math.min(b,Math.max(a,x)),
  dice(a,b){if(a===b)return 1;if(a.length<2||b.length<2)return 0;const m=new Map();for(let i=0;i<a.length-1;i++){const g=a.substr(i,2);m.set(g,(m.get(g)||0)+1)}let h=0;for(let i=0;i<b.length-1;i++){const g=b.substr(i,2),c=m.get(g);if(c>0){m.set(g,c-1);h++}}return 2*h/(a.length+b.length-2)},

  sing(w){if(w.length<4||T.INV.test(w)||/ês$/.test(w))return w;const R=[[/ães$/,'ão'],[/aes$/,'ao'],[/ões$/,'ão'],[/oes$/,'ao'],[/ãos$/,'ão'],[/éis$/,'el'],[/eis$/,'el'],[/óis$/,'ol'],[/ois$/,'ol'],[/ais$/,'al'],[/uis$/,'ul'],[/ns$/,'m'],[/([rz])es$/,'$1'],[/([aeiouáéíóúâêôãõ])s$/,'$1']];for(const[re,s]of R)if(re.test(w))return w.replace(re,s);return w},
  plural(w){const M={'pão':'pães','mão':'mãos','cão':'cães','alemão':'alemães'},lw=w.toLowerCase();if(M[lw])return w[0]===lw[0]?M[lw]:M[lw][0].toUpperCase()+M[lw].slice(1);
    if(/ão$/i.test(w))return w.replace(/ão$/i,'ões');if(/[aeiouáéíóúâêô]$/i.test(w))return w+'s';if(/el$/i.test(w))return w.replace(/el$/i,'éis');if(/al$/i.test(w))return w.replace(/al$/i,'ais');if(/ol$/i.test(w))return w.replace(/ol$/i,'óis');if(/ul$/i.test(w))return w.replace(/ul$/i,'uis');if(/il$/i.test(w))return w.replace(/il$/i,'is');if(/m$/i.test(w))return w.replace(/m$/i,'ns');if(/[rz]$/i.test(w))return w+'es';return w},
  CON:/^(de|do|da|dos|das|com|sem|no|na|nos|nas|ao|à|para|pra|e|em)$/i,
  // flexiona só as palavras antes do primeiro conector: "pães de queijo" -> "pão de queijo"
  headMap(s,fn){const ws=String(s).trim().split(/\s+/);let head=true;return ws.map(w=>{if(T.CON.test(w))head=false;return head?fn(w):w}).join(' ')},

  item(it){const q=+it.q||0,n=it.nome||'item',un=it.un||'un';if(un==='un')return T.num(q)+' '+T.lcFirst(q>1?T.pluralName(n):n);return T.num(q)+' '+T.unLabel(un,q)+' de '+T.lcFirst(n)},
  itens(a){const s=(a||[]).map(T.item);return s.length<2?(s[0]||''):s.slice(0,-1).join(', ')+' e '+s[s.length-1]},

};

const P={
  w2n(s){let tot=0,cur=0;for(const w of String(s).trim().split(/\s+/)){if(w==='e')continue;if(w==='mil'){tot+=(cur||1)*1000;cur=0;continue}cur+=NUMV[w]||0}return tot+cur},

  parse(fala,S,hoje,hm){
    const o=P.pre(fala);let n=U.norm(o);const n0=n;
    const r={tipo:null,fala:String(fala||'').trim(),cli:null,dito:'',itens:[],total:null,dt:null,hora:'',rep:0,forma:'',pago:null,valor:null,tudo:false,tel:'',end:'',nasc:'',txt:'',sempre:false,feito:false,avisos:[],conf:0,origem:'texto',cidade:'',prazo:'',rota:''};

      r.tipo='consulta';r.txt=r.fala;const c=P.acharCli(n,S);if(c)r.cli={id:c.c.id,nome:c.c.nome};r.conf=1;return r}

    // telefone, aniversário, endereço
    each(/(?:\+?55\s?)?\(?\b(\d{2})\)?\s?(9?\s?\d{4})[-\s]?(\d{4})\b/g,m=>{r.tel=(m[1]+m[2]+m[3]).replace(/\D/g,'')});
    each(/\b(?:aniversario|nasceu|nascimento|faz anos)\b(?:\s+(?:dela|dele|e|eh|é|em|no|dia))*\s+(\d{1,2})(?:\/|\s+de\s+)(\d{1,2}|janeiro|fevereiro|marco|abril|maio|junho|julho|agosto|setembro|outubro|novembro|dezembro)\b/g,m=>{const mm=MIDX[m[2]]||+m[2];if(mm<1||mm>12)return false;r.nasc=U.pad(mm)+'-'+U.pad(+m[1])});

    // prazo de pagamento (boleto 28 dias, 28/35/42, à vista)
    each(/\b(?:boleto|prazo(?: de)?|a prazo|parcelado(?: em)?|faturado(?: em)?|faturar(?: em)?|faturamento(?: em)?)\s+(?:para\s+|pra\s+|de\s+|em\s+|com\s+)?(\d{1,3}(?:\s*\/\s*\d{1,3})*)\s*(?:dias|dd|d)?\b/g,m=>{r.prazo=m[1].replace(/\s+/g,'')+' dias';if(/boleto/.test(m[0]))r.forma='boleto'});
    each(/\b(\d{2,3}(?:\/\d{2,3}){2,3})(?:\s*(?:dias|dd))?\b/g,m=>{r.prazo=m[1]+' dias'});
    each(/\b(?:a vista|avista)\b/g,()=>{r.prazo='à vista'});
    // repetição (pedido fixo)
    const setDow=wd=>{const k=(DIDX[wd]-U.dow(hoje)+7)%7;r.dt=U.add(hoje,k)};
    each(new RegExp(`\\btod[ao]s?\\s+(?:as?\\s+|os?\\s+)?${DSEM}s?(?:[-\\s]feiras?)?\\b`,'g'),m=>{r.rep=7;setDow(m[1])});
    each(/\btodo dia (\d{1,2})\b/g,m=>{r.rep=30;r.dt=P.diaMes(+m[1],hoje)});
    each(/\b(?:toda semana|todas as semanas|semanal(?:mente)?)\b/g,()=>{r.rep=7});
    each(/\b(?:quinzenal(?:mente)?|de 15 em 15(?: dias)?|a cada (?:15|quinze) dias)\b/g,()=>{r.rep=14});
    each(new RegExp(`\\ba cada (\\d+|${NUMW}) dias\\b`,'g'),m=>{r.rep=P.n(m[1])||0});

    // datas
    const nd=s=>{if(!r.dt)r.dt=s};
    each(/\b(\d{1,2})\/(\d{1,2})(?:\/(\d{2,4}))?\b/g,m=>{const d=+m[1],mo=+m[2];if(d<1||d>31||mo<1||mo>12)return false;let y=m[3]?+m[3]:+hoje.slice(0,4);if(y<100)y+=2000;let s=y+'-'+U.pad(mo)+'-'+U.pad(d);if(!m[3]&&U.diff(s,hoje)<-60)s=(y+1)+'-'+U.pad(mo)+'-'+U.pad(d);if(!U.isISO(s))return false;nd(s)});
    each(/\b(?:dia\s+)?(\d{1,2})\s+de\s+(janeiro|fevereiro|marco|abril|maio|junho|julho|agosto|setembro|outubro|novembro|dezembro)\b/g,m=>{const y=+hoje.slice(0,4);let s=y+'-'+U.pad(MIDX[m[2]])+'-'+U.pad(+m[1]);if(!U.isISO(s))return false;if(U.diff(s,hoje)<-60)s=(y+1)+s.slice(4);nd(s)});
    each(/\bdepois de amanha\b/g,()=>nd(U.add(hoje,2)));
    each(/\b(?:pra |para |ate )?amanha\b/g,()=>nd(U.add(hoje,1)));
    each(/\b(?:pra |para |ate )?(?:hoje|agora)\b/g,()=>nd(hoje));
    each(/\bontem\b/g,()=>nd(U.add(hoje,-1)));
    each(new RegExp(`\\b(?:daqui a|daqui|em|dentro de)\\s+(\\d+|${NUMW})\\s+dias\\b`,'g'),m=>nd(U.add(hoje,P.n(m[1]))));
    each(/\b(?:(?:na|pra|para)\s+)?(?:semana que vem|proxima semana)\b/g,()=>nd(U.add(hoje,7)));
    each(/\b(?:(?:no|pro|para o|pra o)\s+)?(?:fim|final) de semana\b/g,()=>{const k=(6-U.dow(hoje)+7)%7;nd(U.add(hoje,k))});
    each(new RegExp(`\\b(?:(?:na|no|nesta|neste|nessa|nesse|esta|este|essa|esse|pra|para|ate|proxima|proximo)\\s+)*${DSEM}(?:[-\\s]feira)?(\\s+que vem)?\\b`,'g'),m=>{const wd=DIDX[m[1]];let k=(wd-U.dow(hoje)+7)%7;if(k===0&&(m[2]||/proxim/.test(m[0])))k=7;nd(U.add(hoje,k))});
    each(/\b(?:pra |para |ate |no )?dia (\d{1,2})\b/g,m=>{const d=+m[1];if(d<1||d>31)return false;nd(P.diaMes(d,hoje))});

    // horário
    const sh=(h,mi,per)=>{h=+h;mi=+(mi||0);if(per&&/tarde|noite/.test(per)&&h<12)h+=12;if(h>23||mi>59)return false;r.hora=U.pad(h)+':'+U.pad(mi)};
    each(new RegExp(`\\b(?:as|a partir das|ate as|por volta das|la pelas|umas)\\s+(\\d{1,2}|${NWL})(?:(?::|h)(\\d{2}))?(\\s*(?:h|hs|horas?))?(?:\\s+(da manha|da tarde|da noite))?\\b`,'g'),m=>{const h=P.n(m[1]);if(!m[2]&&!m[3]&&!m[4]){const nw=nextWord(m.index+m[0].length);if(nw&&/^[a-z]/.test(nw)&&!/^(e|pra|para|ou|no|na)$/.test(nw))return false}return sh(h,m[2],m[4])});
    each(/\b(\d{1,2})(?::(\d{2})|h(\d{2})?)\b(?:\s+(da manha|da tarde|da noite))?/g,m=>sh(m[1],m[2]||m[3],m[4]));
    each(/\b(?:ao |as |a )?meio[-\s]dia\b/g,()=>{r.hora='12:00'});
    each(/\b(?:de manha|pela manha|cedo|cedinho|de manhazinha)\b/g,()=>{if(!r.hora)r.hora='manhã'});
    each(/\b(?:a tarde|de tarde|pela tarde|a tardinha)\b/g,()=>{if(!r.hora)r.hora='tarde'});
    each(/\b(?:a noite|de noite|pela noite)\b/g,()=>{if(!r.hora)r.hora='noite'});

    // dinheiro
    const money=[];const NUMD='\\d+(?:\\.\\d+)?';
    const kindOf=(pre,mod)=>mod?'unit':!pre?'plain':/^por$/.test(pre)?'item':/^(total|total de|tudo|deu|ficou|ficou em|valor|valor de|no total)$/.test(pre)?'total':/pag|recebi|pix|deposit|transfer|acertou/.test(pre)?'pay':pre==='a'?'unit':'plain';
    each(new RegExp(`(?:\\b(total de|total|no total|tudo|deu|ficou em|ficou|por|a|pagou|pagaram|me pagou|recebi|pagamento de|pix de|deposito de|valor de|valor|acertou)\\s+)?(?:r\\$\\s*(${NUMD})|\\b(${NUMD}|${NUMW})\\s*(?:reais|real|conto|contos|pila|pilas)\\b)(?:\\s+(cada|cada um|cada uma|a unidade|o kg|o quilo|o kilo|o litro|a duzia|o pacote|a caixa|o pote|o cento|a bandeja|o saco))?`,'g'),m=>{
      const v=m[2]?parseFloat(m[2]):P.n(m[3]);if(!(v>0))return false;const k=kindOf(m[1],m[4]);money.push({v,k,pos:m.index});if(k==='pay'&&/pix/.test(m[1]))r.forma='pix'});
    each(new RegExp(`\\ba\\s+(${NUMD})\\s+(cada|cada um|cada uma|a unidade|o kg|o quilo|o kilo|o litro|a duzia|o pacote|a caixa|o pote|o cento)\\b`,'g'),m=>{money.push({v:+m[1],k:'unit',pos:m.index})});
    each(new RegExp(`\\b(total de|total|no total|deu|ficou em|ficou|valor)\\s+(${NUMD})\\b(?!\\s*(?:${UNRE})\\b)`,'g'),m=>{money.push({v:+m[2],k:'total',pos:m.index})});
    each(new RegExp(`\\bpor\\s+(${NUMD})\\b(?!\\s*(?:${UNRE}|%|dias|semanas)\\b)`,'g'),m=>{money.push({v:+m[1],k:'item',pos:m.index})});
    each(new RegExp(`\\b(pagou|me pagou|recebi|mandou|fez um pix de|pix de|acertou)\\s+(${NUMD})\\b(?!\\s*(?:${UNRE})\\b)`,'g'),m=>{money.push({v:+m[2],k:'pay',pos:m.index});if(/pix/.test(m[1]))r.forma='pix'});

    // pagamento: forma e situação
    each(/\b(?:no |via |pelo |por |com |em )?pix\b/g,()=>{r.forma='pix'});
    each(/\b(?:em |no )?dinheiro\b|\bem especie\b/g,()=>{r.forma='dinheiro'});
    each(/\b(?:no |em |com )?cartao(?: de (?:credito|debito))?\b|\bno (?:debito|credito)\b/g,()=>{r.forma='cartao'});
    each(/\b(?:fiado|na conta|a prazo|no caderno|pendura|pendurar|paga depois|pagar depois|vai pagar depois|pago depois|paga na semana que vem|paga no fim do mes)\b/g,()=>{r.forma='fiado';r.pago=false});
    each(/\b(?:no |via |por |com )?boleto\b/g,()=>{r.forma='boleto';r.pago=false});
    each(/\b(?:ja pagou|ja pago|ja ta pago|ta pago|esta pago|pagamento feito|pagou adiantado|pago|ja acertou)\b/g,()=>{if(r.pago!==false)r.pago=true});
    each(/\b(?:tudo que (?:deve|devia)|o que (?:deve|devia)|a conta toda|tudo|o total)\b/g,()=>{r.tudo=true;return false});

    // "o de sempre" -> repete a cesta prevista
    each(/\b(?:o pedido de sempre|o de sempre|de sempre|o mesmo de sempre|a mesma coisa|mesma coisa|o mesmo|igual (?:a|ao|da|do) (?:ultim[oa]|anterior|semana passada|outra vez)|repete o (?:ultimo )?pedido|repetir o (?:ultimo )?pedido|repete|o previsto|o normal|o costume|o de costume)\b/g,()=>{r.sempre=true});
    if(/\b(comprou|levou|pegou|vendi|vendeu|compramos)\b/.test(n0))r.feito=true;

    // cliente cadastrado (com tolerância a erros de ditado)
    const ac=P.acharCli(n,S);
    if(ac){r.cli={id:ac.c.id,nome:ac.c.nome};r.dito=o.slice(ac.i,ac.j);let i=ac.i;const pre=n.slice(0,i);const hn=new RegExp(`(?:\\b(?:o|a|${HON})\\s+)+$`).exec(pre);if(hn)i=hn.index;mask(i,ac.j)}
    // cidade citada ("pet shop amigo de Blumenau", "pra Indaial")
    for(const m of [...n.matchAll(Geo.re())]){const c=Geo.K[m[2]];if(!c)continue;if(m[1]){if(!r.cidade)r.cidade=c;mask(m.index,m.index+m[0].length)}}
    if(!ac){const nm=P.novoNome(n,o);if(nm){r.cli={id:null,nome:nm.nome};r.dito=nm.nome;mask(nm.i,nm.j);if(!r.cidade){for(const m of [...U.norm(nm.nome).matchAll(Geo.re())]){if(Geo.K[m[2]]){r.cidade=Geo.K[m[2]];break}}}}}

    // itens: quantidade + unidade + produto
    const QRE=new RegExp(`(^|[^a-z0-9.])(meia duzia|meio cento|meio quilo|meio kilo|meio kg|\\d+(?:\\.\\d+)?|${NUMW})(\\s+e\\s+meio)?(?:\\s*(${UNRE})(?![a-z])\\.?)?(\\s+e\\s+meio)?\\s*(?:(?:de|do|da|dos|das)\\s+)?`,'g');
    for(const m of [...n.matchAll(QRE)]){
      const st=m.index+m[1].length;let q,un=m[4]?UNA[m[4]]:'';const raw=m[2];
      if(raw==='meia duzia'){q=6;un=un||'un'}else if(raw==='meio cento'){q=50;un=un||'un'}else if(/^meio (quilo|kilo|kg)$/.test(raw)){q=.5;un='kg'}else q=P.n(raw);
      if(m[3]||m[5])q+=.5;if(!(q>0))continue;
      const pr=P.lerProduto(n,o,m.index+m[0].length);
      if(!pr)continue;
      r.itens.push({q,un,dito:pr.nome,i:st,j:pr.j,pu:null});mask(st,pr.j);
    }
    // produtos do catálogo citados sem número ("quer bolo de cenoura")
    if(!r.sempre&&S&&S.prod.length){for(const f of P.acharProdsSoltos(n,S)){r.itens.push({q:null,un:'',dito:o.slice(f.i,f.j),i:f.i,j:f.j,pu:null});mask(f.i,f.j)}}
    r.itens.sort((a,b)=>a.i-b.i);

    // preços ligados aos itens
    const antes=pos=>{let it=null;for(const x of r.itens)if(x.i<pos)it=x;return it};
    for(const m of money){if(m.k==='unit'){const it=antes(m.pos);if(it)it.pu=m.v;else m.k='plain'}else if(m.k==='item'){const it=antes(m.pos);if(it&&it.q){it.pu=U.r2(m.v/it.q);it.fixo=m.v}else m.k='total'}}
    const plain=money.filter(m=>m.k==='plain');
    if(plain.length>1&&plain.length===r.itens.length&&plain.every((m,i)=>m.pos>r.itens[i].i&&(!r.itens[i+1]||m.pos<r.itens[i+1].i))){plain.forEach((m,i)=>{const it=r.itens[i];if(it.q&&it.pu==null)it.pu=U.r2(m.v/it.q)})}
    else if(plain.length)money.push({v:plain[plain.length-1].v,k:'total2',pos:plain[plain.length-1].pos});
    const pay=money.find(m=>m.k==='pay'),tot=money.find(m=>m.k==='total')||money.find(m=>m.k==='total2');

    // intenção
    const CONTV=/\b(nao atend\w*|nao respond\w*|caixa postal|fora de area|ninguem atendeu|sem pedido|nao vai pedir|nao precisa|nao quer|abastecid\w*|estoque cheio|com estoque|retornar|retorno|ligar de novo|ligar amanha|liga amanha|ligo amanha|pediu p\w* ligar|volto a ligar|vai pedir|vai fazer (?:o )?pedido|falei com|liguei|conversei com)\b/;
    const CANC=/\bcancel(?:a|ar|ou|e|ei|ado|ada)\b|\bdesmarc/,PAYV=/\b(pagou|pagaram|me pagou|acertou|quitou|depositou|transferiu|recebi|mandou o pix|fez o pix|fez um pix|caiu o pix|pagamento)\b/,ENTV=/\b(entreguei|entregue|entregou|ja entreguei|levei|deixei la|deixei o pedido|recebeu o pedido|recebeu a encomenda|saiu pra entrega)\b/,CLIV=/\b(cadastr\w*|novo cliente|nova cliente|cliente nov[oa]|telefone|whats|whatsapp|zap|celular|endereco|mora|aniversario)\b/,NOTAV=/^\s*(nota|anota que|anotar que|obs|observacao|lembrar que|lembra que|lembrete)\b|\b(prefere|gosta de|nao gosta|alergi\w*|intoleran\w*|reclamou|elogiou|falou que|disse que|avisou que|comentou|pediu pra)\b/;

    else if(r.itens.length||r.sempre)r.tipo='pedido';
    else if(r.cli&&!pay&&CONTV.test(n0)){r.tipo='contato';r.res=/\b(nao atend\w*|nao respond\w*|caixa postal|fora de area|ninguem atendeu|sem sinal)\b/.test(n0)?'nao':/\b(retorn\w*|ligar de novo|ligar amanha|liga amanha|ligo amanha|pediu p\w* ligar|volto a ligar|vai pedir|vai fazer (?:o )?pedido|fecha \w+|fechar \w+)\b/.test(n0)||(r.dt&&r.dt>hoje)?'retorno':'sem';r.canal=/\b(whats|zap|mensagem)\b/.test(n0)?'wa':/\b(liguei|ligacao|telefone)\b/.test(n0)?'tel':''}
    else if(pay||PAYV.test(n0))r.tipo='pagamento';
    else if(ENTV.test(n0))r.tipo='entrega';

      if(PAYV.test(n0)&&r.pago==null&&!/\b(paga|pagar|vai pagar)\b/.test(n0))r.pago=true;
    }else if(r.tipo==='pagamento'){
      const v=pay||tot||money[0];r.valor=v?v.v:null;if(!v)r.tudo=true;
    }else if(r.tipo==='nota'){
      r.txt=T.up1(r.fala.replace(/^\s*(nota|anota que|anotar que|anota|obs|observa[cç][aã]o|lembrar que|lembra que|lembrete)\s*:?\s*/i,''));
    }

  },

  diaMes(d,hoje){const y=+hoje.slice(0,4),m=+hoje.slice(5,7);let s=y+'-'+U.pad(m)+'-'+U.pad(d);if(!U.isISO(s)||s<hoje){const ny=m===12?y+1:y,nm=m===12?1:m+1;s=ny+'-'+U.pad(nm)+'-'+U.pad(d);if(!U.isISO(s))s=ny+'-'+U.pad(nm)+'-28'}return s},

  // lê o nome do produto a partir de uma posição, parando em datas, preços, conectores de frase etc.
  lerProduto(n,o,start){
    const re=/[a-z0-9]+(?:-[a-z0-9]+)*|[,;.!?]/g;re.lastIndex=start;const ws=[];let last=start,m;
    while((m=re.exec(n))){const w=m[0];if(ws.length&&/\s{2,}/.test(n.slice(last,m.index)))break;if(/^[,;.!?]$/.test(w))break;
      if(STOPP.has(w)||/^\d/.test(w)||NWSET.has(w))break;if(ws.length>=6)break;
      ws.push({w,i:m.index,j:m.index+w.length});last=m.index+w.length}
    while(ws.length&&/^(de|do|da|dos|das|com|sem|no|na|em|o|a|os|as|um|uma)$/.test(ws[ws.length-1].w))ws.pop();
    while(ws.length&&/^(o|a|os|as)$/.test(ws[0].w))ws.shift();
    if(!ws.length)return null;
    return{nome:o.slice(ws[0].i,ws[ws.length-1].j),i:ws[0].i,j:ws[ws.length-1].j};
  },

  // nomes candidatos de um cliente: nome, apelidos e primeiro nome (se único)
  acharCli(n,S){
    if(!S||!S.cli.length)return null;
    const words=[...n.matchAll(/[a-z0-9]+/g)].map(m=>({w:m[0],i:m.index,j:m.index+m[0].length}));if(!words.length)return null;
    const firsts=new Map();for(const c of S.cli){const f=U.key(c.nome).split(' ').filter(x=>!new RegExp(`^(${HON})$`).test(x))[0];if(f&&f.length>=3)firsts.set(f,(firsts.get(f)||0)+1)}
    let best=null;
    for(const c of S.cli){
      const names=[c.nome,...(c.apel||[])].map(U.key).filter(x=>x.length>=2);
      const f=U.key(c.nome).split(' ').filter(x=>!new RegExp(`^(${HON})$`).test(x))[0];
      for(let k=Math.min(5,words.length);k>=1;k--){for(let a=0;a+k<=words.length;a++){
        const win=words.slice(a,a+k).map(x=>x.w).join(' ');let sc=0;
        for(const nm of names){if(nm===win)sc=Math.max(sc,1+k*.01);else if(win.length>=5&&nm.length>=5){const d=U.dice(nm,win);if(d>=.86)sc=Math.max(sc,d*.95+k*.01)}}
        if(!sc&&k===1&&f&&win===f&&firsts.get(f)===1)sc=.8;
        if(sc&&(!best||sc>best.sc))best={c,sc,i:words[a].i,j:words[a+k-1].j};
      }}
    }
    return best;
  },

  // cliente ainda não cadastrado: nome antes do verbo ("Joana pediu"), depois de "pedido da", "pra Fulana" (com inicial maiúscula)
  novoNome(n,o){
    const walk=(pos,cap)=>{const re=/[a-z]+/g;re.lastIndex=pos;const ws=[];let m,last=pos;
      while((m=re.exec(n))){if(/[^\s]/.test(n.slice(last,m.index).replace(/[\s]/g,'')))break;if(ws.length&&/\s{2,}/.test(n.slice(last,m.index)))break;const w=m[0];
        if(!ws.length&&new RegExp(`^(${HON})$`).test(w)){ws.push({w,i:m.index,j:m.index+w.length,h:1});last=m.index+w.length;continue}
        if(/^(da|de|do|das|dos)$/.test(w)&&ws.length&&ws.length<4){const nx=/^\s+([a-z]+)/.exec(n.slice(m.index+w.length));if(nx&&!STOPN.has(nx[1])&&nx[1].length>=2){ws.push({w,i:m.index,j:m.index+w.length,c:1});last=m.index+w.length;continue}break}
        if(STOPN.has(w)||w.length<2||ws.length>=4)break;
        if(cap&&!/^[A-ZÀ-Ý]/.test(o.charAt(m.index)))break;
        ws.push({w,i:m.index,j:m.index+w.length});last=m.index+w.length}
      while(ws.length&&ws[ws.length-1].c)ws.pop();
      if(!ws.length||ws.every(x=>x.h))return null;return{i:ws[0].i,j:ws[ws.length-1].j,end:last}};
    const ok=x=>x&&{nome:T.title(o.slice(x.i,x.j)),i:x.i,j:x.j};
    // 1) começo da frase, seguido de verbo
    const lead=/^\s*(?:(?:anota(?:r)?|novo pedido|pedido|olha|entao|ai|cliente|nota|nova|novo|um|uma)\s*[:,-]?\s+)*(?:(?:o|a)\s+)?/.exec(n);
    const x1=walk(lead[0].length,false);
    if(x1){const nx=/^\s*([a-z]+)/.exec(n.slice(x1.j));if(nx&&VERBSET.has(nx[1]))return ok(x1)}
    // 2) depois de gatilhos explícitos
    for(const m of n.matchAll(/\b(?:cliente nov[oa]|novo cliente|nova cliente|cadastrar|cadastre|cadastra|pedido|encomenda|compra|pagamento|entrega|cliente|conta|anotar|anota|nota|entreguei|levei|recebi|festa|aniversario|casamento|cha|evento)(?:\s+(?:\S+\s+){0,3}?)?\s*:?\s*(?:d[aoe]s?|pra|para|pro|a|o)?\s+(?=[a-z])/g)){const x=walk(m.index+m[0].length,false);if(x)return ok(x)}
    // 3) "pra Fulana" só se o nome veio com inicial maiúscula
    for(const m of n.matchAll(/\b(?:pra|para|pro)\s+(?:(?:o|a)\s+)?(?=[a-z])/g)){const x=walk(m.index+m[0].length,true);if(x)return ok(x)}
    return null;
  },

  acharProdsSoltos(n,S){
    const words=[...n.matchAll(/[a-z0-9]+/g)].map(m=>({w:m[0],i:m.index,j:m.index+m[0].length}));const out=[];const used=new Set();
    const keys=S.prod.map(p=>({p,ks:[p.nome,...(p.alias||[])].map(P.pkey)}));
    for(let k=Math.min(5,words.length);k>=1;k--)for(let a=0;a+k<=words.length;a++){
      if([...Array(k).keys()].some(x=>used.has(a+x)))continue;
      const seg=words.slice(a,a+k);if(STOPP.has(seg[0].w))continue;
      const win=seg.map(x=>P.singN(x.w)).join(' ');if(win.length<4)continue;
      if(keys.some(e=>e.ks.includes(win))){out.push({i:seg[0].i,j:seg[k-1].j});for(let x=0;x<k;x++)used.add(a+x)}
    }
    return out;
  },

  // completa com o cadastro: cliente, produtos do catálogo, preços aprendidos, data padrão, confiança
  resolver(r,S,hoje,hm){
    const cid=r.cli&&r.cli.id;const cli=cid&&Core.cli(S,cid);
    const rota=cli?Rota.doCli(S,cli):Rota.daCidade(S,r.cidade);if(rota)r.rota=rota.id;
    if(!r.prazo&&cli&&cli.prazo)r.prazo=cli.prazo;
    if(r.tipo==='pedido'){
      if(r.sempre&&!r.itens.length&&cid){const pr=Predict.cliente(S,cid,hoje);const base=pr&&pr.cesta.length?pr.cesta:(Core.ultimo(S,cid)||{itens:[]}).itens;r.itens=base.map(i=>({pid:i.pid,nome:i.nome,q:i.q,un:i.un,pu:i.pu,dito:''}));r.avisos.push('Repeti o que '+r.cli.nome+' costuma pedir (pelo histórico).')}
      else if(r.sempre&&!cid)r.avisos.push('Para repetir "o de sempre", diga de qual cliente.');
      for(const it of r.itens){
        if(it.pid&&!it.dito)continue;
        const p=Core.acharProd(S,it.dito,cid);
        if(p){it.pid=p.id;it.nome=p.nome;if(it.un==='dz'&&p.un!=='dz'){it.q*=12;it.un=p.un}else if(it.un==='cento'&&p.un!=='cento'){it.q*=100;it.un=p.un}else if(!it.un&&p.un==='cento'&&it.q>=20){it.q=U.r2(it.q/100)}else if(!it.un&&p.un==='dz'&&it.q>=12&&it.q%6===0){it.q=it.q/12}if(!it.un)it.un=p.un||'un'}
        else{it.pid=null;it.nome=T.up1(T.singName(it.dito));if(it.un==='dz'){it.q*=12;it.un='un'}else if(it.un==='cento'){it.q*=100;it.un='un'}if(!it.un)it.un='un';r.avisos.push('Produto novo: '+it.nome)}
        if(it.q==null){const lp=cid&&Core.ultimaCompra(S,cid,it.pid);it.q=lp?lp.q:1}
        if(it.pu==null){const lp=cid&&it.pid&&Core.ultimaCompra(S,cid,it.pid);const p2=it.pid&&Core.prod(S,it.pid);it.pu=lp?lp.pu:p2&&p2.preco?p2.preco:null}
      }
      const soma=r.itens.reduce((s,i)=>s+(i.pu||0)*(i.q||0),0);
      const semPreco=r.itens.filter(i=>i.pu==null);
      if(r.total!=null&&semPreco.length===1){const it=semPreco[0];const resto=r.total-(soma);if(resto>0&&it.q)it.pu=U.r2(resto/it.q)}
      if(r.total==null)r.total=U.r2(r.itens.reduce((s,i)=>s+(i.pu||0)*(i.q||0),0));
      r.itens.filter(i=>i.pu==null).forEach(i=>r.avisos.push('Sem preço: '+i.nome));
      if(!r.dt){const pe=!r.feito&&rota&&Rota.proxEntrega(rota,hoje,hm);if(pe){r.dt=pe;r.avisos.push('Entrega pela rota '+rota.nome+': '+T.quando(pe,hoje)+'.')}else{r.dt=hoje;if(!r.feito)r.avisos.push(Rota.lista(S).length&&!rota?'Cidade sem rota: data ficou para hoje.':'Sem data: ficou para hoje.')}}
      else if(rota&&(rota.dias||[]).length&&r.dt>hoje&&!rota.dias.includes(U.dow(r.dt)))r.avisos.push(T.up1(T.DIA[U.dow(r.dt)])+' não é dia de caminhão na rota '+rota.nome+' ('+Rota.diasTxt(rota)+').');
      if(S.cfg.pedMin&&r.total>0&&r.total<S.cfg.pedMin)r.avisos.push('Abaixo do pedido mínimo de '+T.brl(S.cfg.pedMin)+'.');
      if(r.itens.some(i=>{const p=i.pid&&Core.prod(S,i.pid);return p&&p.frio}))r.avisos.push('Tem item refrigerado: sai da câmara fria em caixa térmica.');
    }
    if(r.tipo==='contato'&&r.res==='retorno'&&(!r.dt||r.dt<=hoje)){let d=U.add(hoje,1);while(U.dow(d)===0||U.dow(d)===6)d=U.add(d,1);r.dt=d}
    if(!r.dt)r.dt=hoje;
    if(r.cli&&!r.cli.id&&r.tipo!=='consulta')r.avisos.unshift('Cliente novo: '+r.cli.nome+' será cadastrado.');
    if(!r.cli&&r.tipo!=='nota')r.avisos.unshift('Não achei o cliente: escolha abaixo.');
    // confiança
    let c=0;if(cid)c+=.45;else if(r.cli)c+=.3;
    if(r.tipo==='pedido'){if(r.itens.length)c+=.3;if(r.itens.length&&r.itens.every(i=>i.pid))c+=.15;if(r.itens.length&&r.itens.every(i=>i.pu!=null))c+=.1}
    else if(r.tipo==='pagamento'){if(r.valor!=null||r.tudo)c+=.5}
    else if(r.tipo==='nota'){c+=r.cli?.4:.2}
    else c+=.45;
    r.conf=U.clamp(U.r2(c),0,1);
    r.itens.forEach(i=>{delete i.i;delete i.j});
    return r;
  },

  // resposta da IA (JSON) -> mesmo formato do intérprete local
  deIA(x,S,hoje,fala,hm){
    const r={tipo:['pedido','pagamento','entrega','nota','cliente','cancelar','consulta'].includes(x&&x.tipo)?x.tipo:'nota',fala:fala||'',cli:null,dito:'',itens:[],total:null,dt:null,hora:'',rep:0,forma:'',pago:null,valor:null,tudo:false,tel:'',end:'',nasc:'',txt:'',sempre:!!(x&&x.de_sempre),feito:false,avisos:[],conf:.9,origem:'ia',cidade:'',prazo:'',rota:''};
    if(!x)return r;
    const c=(x.cliente_id&&Core.cli(S,String(x.cliente_id)))||(x.cliente_nome&&Core.acharCli(S,x.cliente_nome));
    if(c){r.cli={id:c.id,nome:c.nome};r.dito=x.cliente_nome||''}else if(x.cliente_nome)r.cli={id:null,nome:T.title(String(x.cliente_nome))};
    (Array.isArray(x.itens)?x.itens:[]).forEach(i=>{const q=+i.qtd;if(!(q>0)||!i.produto)return;const un=UNA[U.key(i.un||'')]||(T.UNI[i.un]?i.un:'');r.itens.push({q,un,dito:String(i.produto),pu:+i.preco_unit>0?+i.preco_unit:null})});
    if(+x.total>0)r.total=+x.total;
    if(U.isISO(x.data))r.dt=x.data;
    if(x.hora&&/^\d{1,2}:\d{2}$/.test(x.hora))r.hora=x.hora.padStart(5,'0');
    if(+x.repetir_dias>0)r.rep=Math.round(+x.repetir_dias);
    if(['pix','dinheiro','cartao','fiado','boleto'].includes(x.pagamento))r.forma=x.pagamento;
    if(x.prazo)r.prazo=String(x.prazo);if(x.cidade)r.cidade=Geo.nome(x.cidade)||'';
    if(x.pago===true)r.pago=true;else if(x.pago===false)r.pago=false;
    if(+x.valor>0){if(r.tipo==='pagamento')r.valor=+x.valor;else if(r.tipo==='pedido')r.pago=+x.valor}
    if(r.tipo==='pagamento'&&r.valor==null)r.tudo=true;
    if(x.telefone)r.tel=String(x.telefone).replace(/\D/g,'');
    if(x.endereco)r.end=String(x.endereco);
    if(x.texto)r.txt=String(x.texto);
    if(r.tipo==='nota'&&!r.txt)r.txt=fala;
    const conf=r.conf;const out=P.resolver(r,S,hoje,hm);out.conf=Math.max(out.conf,conf*.9);out.origem='ia';return out;
  }
};

/* ---------- previsão: quando cada cliente volta, o que deve pedir e quanto ---------- */
const Predict={
  global(S){const by=new Map();for(const p of S.ped){if(p.st==='cancelado')continue;(by.get(p.cid)||by.set(p.cid,new Set()).get(p.cid)).add(p.dt)}const meds=[];for(const ds of by.values()){const a=[...ds].sort();if(a.length<2)continue;const iv=[];for(let i=1;i<a.length;i++)iv.push(U.diff(a[i],a[i-1]));meds.push(U.median(iv))}return meds.length?U.median(meds):14},
  cliente(S,cid,hoje,g){
    const ps=S.ped.filter(p=>p.cid===cid&&p.st!=='cancelado').sort((a,b)=>a.dt<b.dt?-1:a.dt>b.dt?1:(a.cri||0)-(b.cri||0));
    if(!ps.length)return null;
    const ds=[...new Set(ps.map(p=>p.dt))];const pass=ds.filter(d=>d<=hoje);
    const ult=ds[ds.length-1],ultPass=pass[pass.length-1]||null;
    const iv=[];for(let i=1;i<ds.length;i++)iv.push(U.diff(ds[i],ds[i-1]));
    let est,sd,conf,base;
    if(!iv.length){est=g||Predict.global(S);sd=est*.5;conf=.2;base='geral'}
    else{const m=U.median(iv);const cl=iv.map(x=>U.clamp(x,Math.max(1,m/3),m*3));let e=cl[0];for(let i=1;i<cl.length;i++)e=.35*cl[i]+.65*e;est=Math.max(1,.6*e+.4*m);sd=cl.length>1?U.std(cl):est*.35;const cv=sd/est;conf=U.clamp((1-Math.min(cv,1))*Math.min(1,(iv.length+1)/5),.12,.96);base='cliente'}
    const l8=ds.slice(-8).map(U.dow),cnt=[0,0,0,0,0,0,0];l8.forEach(d=>cnt[d]++);const mx=Math.max(...cnt);
    const dowFav=ds.length>=3&&mx/l8.length>=.6&&est>=5?cnt.indexOf(mx):null;
    let prox=U.add(ult,Math.round(est));
    if(dowFav!=null){let b=prox,bd=9;for(let k=-3;k<=3;k++){const c=U.add(prox,k);if(U.dow(c)===dowFav&&Math.abs(k)<bd&&c>ult){b=c;bd=Math.abs(k)}}prox=b}
    const win=Math.max(1,Math.round(Math.min(sd,est*.5)));
    const dias=U.diff(prox,hoje),desde=ultPass?U.diff(hoje,ultPass):null;
    const c=Core.cli(S,cid);
    const aberto=ps.some(p=>p.st==='aberto'),futuro=ult>hoje;
    let st;
    if(aberto||futuro)st='agendado';
    else if(c&&c.snz&&c.snz>hoje)st='adiado';
    else if(desde!=null&&desde>Math.max(est*2+win,est+7))st='sumido';
    else if(!iv.length)st='novo';
    else if(dias<-win)st='atrasado';
    else if(dias<=1)st='hoje';
    else st='emdia';
    // cesta provável a partir dos últimos 6 pedidos (recentes pesam mais; tendência ajusta a quantidade)
    const rec=ps.slice(-6),mp=new Map();
    rec.forEach((p,idx)=>{const age=rec.length-1-idx;(p.itens||[]).forEach(it=>{const k=it.pid||('n:'+P.pkey(it.nome));let e=mp.get(k);if(!e){e={pid:it.pid||null,nome:it.nome,un:it.un,qs:[],ws:[],ix:new Set(),pu:it.pu};mp.set(k,e)}e.qs.push(+it.q||0);e.ws.push(Math.pow(.6,age));e.ix.add(idx);e.pu=it.pu!=null?it.pu:e.pu;e.nome=it.nome;e.un=it.un})});
    const cesta=[];
    for(const e of mp.values()){
      const freq=e.ix.size/rec.length,inLast=e.ix.has(rec.length-1);if(freq<.5&&!(inLast&&rec.length<=2))continue;
      let q=e.qs.reduce((s,x,i)=>s+x*e.ws[i],0)/e.ws.reduce((s,x)=>s+x,0),tr=0;
      if(e.qs.length>=3){const k=e.qs.length,mxx=(k-1)/2,my=U.mean(e.qs);let nu=0,de=0,sy=0;e.qs.forEach((y,x)=>{nu+=(x-mxx)*(y-my);de+=(x-mxx)**2;sy+=(y-my)**2});const sl=de?nu/de:0;tr=my?U.clamp(sl/my,-.25,.25):0;const r2=de&&sy?nu*nu/(de*sy):0;const yh=U.clamp(my+sl*(k-mxx),Math.min(...e.qs)*.7,Math.max(...e.qs)*1.3);const w=r2*.8;q=(1-w)*q+w*yh}
      if(e.un==='kg'||e.un==='L')q=q>=2?Math.round(q*2)/2:Math.max(.1,Math.round(q*10)/10);else if(e.un==='g'||e.un==='ml')q=Math.max(50,Math.round(q/50)*50);else q=Math.max(1,Math.round(q));
      const pp=e.pid&&Core.prod(S,e.pid);const pu=e.pu!=null?e.pu:pp?pp.preco:0;
      cesta.push({pid:e.pid,nome:e.nome,un:e.un,q,pu:U.r2(pu||0),freq:U.r2(freq),tr:U.r2(tr)});
    }
    cesta.sort((a,b)=>b.q*b.pu-a.q*a.pu);
    const valor=U.r2(cesta.reduce((s,i)=>s+i.q*i.pu,0));
    return{cid,n:ps.length,ult,ultPass,desde,est:Math.round(est*10)/10,sd:U.r2(sd),win,conf:U.r2(conf),base,prox,dias,st,dowFav,cesta,valor,iv:iv.length,due:dias<=1};
  },
  todos(S,hoje){const g=Predict.global(S);return S.cli.map(c=>Predict.cliente(S,c.id,hoje,g)).filter(Boolean)},
  PROB:{hoje:.8,atrasado:.6,emdia:.8,agendado:.8,novo:.4,adiado:.5,sumido:.15},
  horizonte(S,hoje,N,todos){
    const out=[],fim=U.add(hoje,N-1);
    for(const pr of todos||Predict.todos(S,hoje)){
      let d=pr.prox<hoje?hoje:pr.prox,k=0;
      while(d<=fim&&k<12){out.push({cid:pr.cid,dt:d,valor:pr.valor,cesta:pr.cesta,p:U.r2(Predict.PROB[pr.st]*Math.pow(.85,k)*(.5+.5*pr.conf)),st:pr.st});d=U.add(d,Math.max(1,Math.round(pr.est)));k++}
    }
    return out.sort((a,b)=>a.dt<b.dt?-1:1);
  }
};

    ['Interno: contato por voz (não atendeu, retorno, sem pedido)',()=>{const S=Demo.agro(H);const a=P.parse('Amigo Fiel não atendeu',S,H,'09:00'),b=P.parse('liguei pra Vida Animal, pediu pra ligar quinta',S,H,'09:00'),c=P.parse('Pet Center está abastecido, sem pedido essa semana',S,H,'09:00');return a.tipo==='contato'&&a.res==='nao'&&b.tipo==='contato'&&b.res==='retorno'&&b.dt==='2026-11-12'&&b.canal==='tel'&&c.tipo==='contato'&&c.res==='sem'}],

    ['Backup exporta e importa sem perder nada',()=>{const S=Demo.gerar(H);const r=Core.importar(JSON.stringify({...S,demo:undefined}));return r.ok&&r.S.ped.length===S.ped.length&&r.S.cli.length===S.cli.length}]
  ];
})();
function rodarTestes(){return Testes.map(([d,f])=>{let ok=false,e='';try{ok=!!f()}catch(x){e=String(x&&x.message||x)}return{d,ok,e}})}
</script>
<script>
/* ============ Freguês · interface ============ */
const $=id=>document.getElementById(id);
const E=U.esc;
const HOJE=()=>U.hoje();
const EMBED=(()=>{try{return window.self!==window.top}catch(e){return true}})();
let S=Core.vazio();
const ui={tab:'hoje',cli:null,pf:'abertos',q:'',cf:'todos',arm:'',sheet:null,drafts:[],ouvindo:false,enviados:new Set(),testes:null,busy:false};
const IA={s:null,dl:null};
let PR=null,PRd='';
function preds(){const h=HOJE();if(!PR||PRd!==h){PR=Predict.todos(S,h);PRd=h}return PR}
function predOf(cid){return preds().find(p=>p.cid===cid)||null}
function mudou(){PR=null;Store.save()}
function J(v){return E(JSON.stringify(v))}

/* ---------- ícones ---------- */
const sv=p=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${p}</svg>`;
const I={
  hoje:sv('<circle cx="12" cy="12" r="4"/><path d="M12 3v2M12 19v2M5.6 5.6 7 7M17 17l1.4 1.4M3 12h2M19 12h2M5.6 18.4 7 17M17 7l1.4-1.4"/>'),
  clientes:sv('<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.6 3.4-5.5 6.5-5.5s5.7 1.9 6.5 5.5"/><path d="M16 4.6a3.5 3.5 0 0 1 0 6.8M18 14.8c1.8.7 3 2.4 3.5 5.2"/>'),
